<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Delivery Review Console</title>
<style>/* ============================================================
   Delivery Review Console
   Cool blue/slate enterprise · light default · airy
   App-shell generalized from the BA Research S1 viewer:
   left-nav menus = pipeline stages; data-driven over window.PACK.
   ============================================================ */

:root {
  /* surfaces */
  --bg:        #f6f8fb;
  --surface:   #ffffff;
  --surface-2: #f1f5fa;
  --surface-3: #e9eff6;
  --sidebar:   #fbfcfe;

  /* ink */
  --ink:       #0f1b2d;
  --ink-2:     #34465f;
  --muted:     #64758c;
  --faint:     #93a1b5;

  /* lines */
  --line:      #e3e9f1;
  --line-2:    #d3dce8;

  /* brand */
  --accent:    #2563eb;
  --accent-ink:#1d4ed8;
  --accent-bg: #eaf1ff;
  --accent-line:#c5d8ff;

  /* semantic — priority (MoSCoW) */
  --must:      #d3372b;  --must-bg:#fdecea;
  --should:    #b9740a;  --should-bg:#fdf3e3;
  --could:     #5b6b82;  --could-bg:#eef2f7;

  /* severity */
  --p1:        #d3372b;  --p1-bg:#fdecea;
  --p2:        #b9740a;  --p2-bg:#fdf3e3;
  --p3:        #5b6b82;  --p3-bg:#eef2f7;

  /* confidence */
  --low:       #d3372b;
  --medium:    #b9740a;
  --high:      #1a7f4b;

  /* status */
  --applies:   #1a7f4b;  --applies-bg:#e7f5ec;
  --na:        #8595a9;  --na-bg:#eef2f7;
  --ok:        #1a7f4b;  --ok-bg:#e7f5ec;
  --bad:       #d3372b;  --bad-bg:#fdecea;
  --warn:      #b9740a;  --warn-bg:#fdf3e3;

  /* gate board roll-up hues */
  --gate-green: #1a7f4b; --gate-green-bg:#e7f5ec; --gate-green-line:#bfe3cd;
  --gate-amber: #b9740a; --gate-amber-bg:#fdf3e3; --gate-amber-line:#f0dcb0;
  --gate-red:   #d3372b; --gate-red-bg:#fdecea;   --gate-red-line:#f3c7c2;
  --gate-pend:  #64758c; --gate-pend-bg:#eef2f7;  --gate-pend-line:#d3dce8;

  /* product-risk hues */
  --value:      #2563eb; --value-bg:#eaf1ff;
  --usability:  #7c3aed; --usability-bg:#f1ebfd;
  --feasibility:#b9740a; --feasibility-bg:#fdf3e3;
  --viability:  #0e8a74; --viability-bg:#e3f5f1;

  /* tier hues */
  --t1: #3b5bdb; --t1-bg:#e8ecfb; --t1-line:#c2cdf4;
  --t2: #0284c7; --t2-bg:#e1f3fb; --t2-line:#aadcf1;
  --t3: #0d9488; --t3-bg:#e0f5f2; --t3-line:#a6e0d8;

  --shadow-sm: 0 1px 2px rgba(15,27,45,.05);
  --shadow:    0 1px 3px rgba(15,27,45,.06), 0 8px 24px -12px rgba(15,27,45,.10);
  --shadow-lg: 0 24px 60px -20px rgba(15,27,45,.30);

  --radius:   12px;
  --radius-sm: 8px;
  --sidebar-w: 308px;
  --reading:  920px;
}

:root[data-theme="dark"] {
  --bg:        #0b1220;
  --surface:   #111a2b;
  --surface-2: #16223a;
  --surface-3: #1c2c49;
  --sidebar:   #0d1626;

  --ink:       #e8eefb;
  --ink-2:     #b9c6dc;
  --muted:     #8294b0;
  --faint:     #5e708c;

  --line:      #223047;
  --line-2:    #2c3d59;

  --accent:    #5b9bff;
  --accent-ink:#84b4ff;
  --accent-bg: #16294a;
  --accent-line:#2a4575;

  --must:#f08379; --must-bg:#3a1c1a;
  --should:#e6a948; --should-bg:#382a14;
  --could:#9fb0c8; --could-bg:#1d2840;

  --p1:#f08379; --p1-bg:#3a1c1a;
  --p2:#e6a948; --p2-bg:#382a14;
  --p3:#9fb0c8; --p3-bg:#1d2840;

  --low:#f08379; --medium:#e6a948; --high:#54c98a;

  --applies:#54c98a; --applies-bg:#16301f;
  --na:#7e90aa; --na-bg:#1d2840;
  --ok:#54c98a; --ok-bg:#16301f;
  --bad:#f08379; --bad-bg:#3a1c1a;
  --warn:#e6a948; --warn-bg:#382a14;

  --gate-green:#54c98a; --gate-green-bg:#16301f; --gate-green-line:#235a39;
  --gate-amber:#e6a948; --gate-amber-bg:#382a14; --gate-amber-line:#5e4620;
  --gate-red:#f08379;   --gate-red-bg:#3a1c1a;   --gate-red-line:#5e2a25;
  --gate-pend:#8294b0;  --gate-pend-bg:#1d2840;  --gate-pend-line:#2c3d59;

  --value:#5b9bff; --value-bg:#16294a;
  --usability:#a98bf0; --usability-bg:#241a3c;
  --feasibility:#e6a948; --feasibility-bg:#382a14;
  --viability:#37c2a6; --viability-bg:#103029;

  --t1:#8098f0; --t1-bg:#161d3a; --t1-line:#2c3a73;
  --t2:#52b4e8; --t2-bg:#0c2536; --t2-line:#1d4a68;
  --t3:#52c4b6; --t3-bg:#0b2b27; --t3-line:#1b5249;

  --shadow-sm: 0 1px 2px rgba(0,0,0,.4);
  --shadow:    0 1px 3px rgba(0,0,0,.4), 0 8px 24px -12px rgba(0,0,0,.6);
  --shadow-lg: 0 24px 60px -20px rgba(0,0,0,.7);
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
html { scroll-behavior: smooth; }

body {
  background: var(--bg);
  color: var(--ink);
  font-family: ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  font-size: 15px;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}

.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-feature-settings: 'ss01';
}

a { color: inherit; }
::selection { background: var(--accent-bg); color: var(--accent-ink); }

/* ============================================================
   App shell
   ============================================================ */
.app {
  display: grid;
  grid-template-columns: var(--sidebar-w) 1fr;
  min-height: 100vh;
}

/* ---------- Sidebar ---------- */
.sidebar {
  position: sticky;
  top: 0;
  align-self: start;
  height: 100vh;
  overflow-y: auto;
  background: var(--sidebar);
  border-right: 1px solid var(--line);
  padding: 22px 16px 28px;
  display: flex;
  flex-direction: column;
  gap: 18px;
}
.sidebar::-webkit-scrollbar { width: 8px; }
.sidebar::-webkit-scrollbar-thumb { background: var(--line-2); border-radius: 8px; }

.brand { display: flex; flex-direction: column; gap: 10px; padding: 4px 8px 0; }
.brand .mark {
  display: inline-flex; align-items: center; gap: 9px;
  font-weight: 700; font-size: 15px; letter-spacing: -0.01em;
}
.brand .glyph {
  width: 26px; height: 26px; border-radius: 7px;
  background: var(--accent); color: #fff;
  display: grid; place-items: center;
  font-size: 12px; font-weight: 700; flex: none;
  box-shadow: inset 0 0 0 1px rgba(255,255,255,.16);
}
.brand .sub {
  font-size: 11.5px; color: var(--muted); font-weight: 500;
  letter-spacing: .02em;
}
.brand .stage-row { display: flex; gap: 6px; flex-wrap: wrap; }

/* search */
.search { position: relative; }
.search input {
  width: 100%;
  background: var(--surface);
  border: 1px solid var(--line-2);
  border-radius: var(--radius-sm);
  padding: 9px 12px 9px 32px;
  font: inherit; font-size: 13.5px;
  color: var(--ink);
  outline: none;
  transition: border-color .15s, box-shadow .15s;
}
.search input::placeholder { color: var(--faint); }
.search input:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px var(--accent-bg);
}
.search .ico {
  position: absolute; left: 10px; top: 50%; transform: translateY(-50%);
  color: var(--faint); pointer-events: none; display: flex;
}
.search .clear {
  position: absolute; right: 6px; top: 50%; transform: translateY(-50%);
  border: none; background: none; color: var(--faint); cursor: pointer;
  font-size: 14px; padding: 4px 6px; border-radius: 6px; display: none;
}
.search .clear:hover { background: var(--surface-2); color: var(--ink); }
.search.has-value .clear { display: block; }

/* nav tree */
.nav-tree { display: flex; flex-direction: column; gap: 2px; }
.nav-group-label {
  font-size: 10.5px; text-transform: uppercase; letter-spacing: .09em;
  color: var(--faint); font-weight: 600;
  padding: 14px 10px 5px;
}
.nav-item {
  display: flex; align-items: center; gap: 9px;
  padding: 7px 10px; border-radius: var(--radius-sm);
  color: var(--ink-2); font-size: 13.5px; font-weight: 500;
  text-decoration: none; cursor: pointer;
  border: 1px solid transparent;
  transition: background .12s, color .12s;
  position: relative;
}
.nav-item .num {
  font-size: 10px; font-weight: 600; color: var(--faint);
  width: 20px; text-align: center; flex: none;
}
.nav-item:hover { background: var(--surface-2); color: var(--ink); }
.nav-item.active {
  background: var(--accent-bg); color: var(--accent-ink);
  font-weight: 600;
}
.nav-item.active .num { color: var(--accent); }
.nav-item.pending { color: var(--faint); }
.nav-item.pending .num { color: var(--faint); opacity: .7; }
.nav-item.sub {
  font-size: 12.5px; padding: 5px 10px 5px 38px; font-weight: 500;
  color: var(--muted);
}
.nav-item.sub::before {
  content: ""; position: absolute; left: 22px; top: 0; bottom: 0;
  width: 1px; background: var(--line-2);
}
.nav-item.sub:hover { color: var(--ink); }
.nav-item.sub.active { color: var(--accent-ink); background: transparent; }
.nav-item.sub.active::before { background: var(--accent); }
.nav-item.sub2 {
  font-size: 11.5px; padding: 4px 10px 4px 52px; font-weight: 500;
  color: var(--faint); gap: 8px;
}
.nav-item.sub2::before {
  content: ""; position: absolute; left: 22px; top: 0; bottom: 0;
  width: 1px; background: var(--line-2);
}
.nav-item.sub2 .snum {
  font-size: 10px; font-weight: 600; color: var(--faint);
  flex: none; opacity: .8;
}
.nav-item.sub2 .slabel { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.nav-item.sub2:hover { color: var(--ink); }
.nav-item.sub2:hover .snum { color: var(--accent); opacity: 1; }
.nav-item .pip {
  margin-left: auto; font-size: 10.5px; color: var(--faint);
  font-variant-numeric: tabular-nums;
}
.nav-gate {
  margin-left: auto; flex: none; width: 8px; height: 8px; border-radius: 50%;
  background: var(--line-2);
}
.nav-gate.g { background: var(--gate-green); }
.nav-gate.a { background: var(--gate-amber); }
.nav-gate.r { background: var(--gate-red); }
.nav-gate.p { background: var(--gate-pend); }

/* sidebar footer controls */
.side-foot { margin-top: auto; display: flex; flex-direction: column; gap: 12px; padding: 0 4px; }
.legend { display: flex; flex-direction: column; gap: 8px; }
.legend .legend-title {
  font-size: 10.5px; text-transform: uppercase; letter-spacing: .09em;
  color: var(--faint); font-weight: 600;
}
.legend .row { display: flex; gap: 7px; flex-wrap: wrap; }
.side-actions { display: flex; gap: 8px; }
.btn {
  appearance: none; border: 1px solid var(--line-2);
  background: var(--surface); color: var(--ink-2);
  border-radius: var(--radius-sm); padding: 8px 11px;
  font: inherit; font-size: 12.5px; font-weight: 600;
  cursor: pointer; display: inline-flex; align-items: center; gap: 7px;
  transition: border-color .12s, color .12s, background .12s;
}
.btn:hover { border-color: var(--accent); color: var(--accent); }
.btn .kbd { font-size: 10px; }
.btn.full { flex: 1; justify-content: center; }

.kbd {
  font-family: monospace; font-size: 10.5px;
  background: var(--surface-2); border: 1px solid var(--line-2);
  border-bottom-width: 2px; border-radius: 5px;
  padding: 1px 5px; color: var(--muted); font-weight: 500;
}

/* ============================================================
   Main content
   ============================================================ */
.main { min-width: 0; padding: 0 0 120px; position: relative; }
.content { max-width: 1040px; margin: 0 auto; padding: 0 48px; }

/* top bar */
.topbar {
  position: sticky; top: 0; z-index: 20;
  background: color-mix(in srgb, var(--bg) 86%, transparent);
  backdrop-filter: saturate(1.4) blur(10px);
  -webkit-backdrop-filter: saturate(1.4) blur(10px);
  border-bottom: 1px solid var(--line);
}
.topbar-inner {
  max-width: 1040px; margin: 0 auto; padding: 13px 48px;
  display: flex; align-items: center; gap: 14px;
}
.crumb { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); min-width: 0; }
.crumb b { color: var(--ink); font-weight: 600; }
.crumb .sep { color: var(--faint); }
.crumb .ell { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.topbar .spacer { margin-left: auto; }
.topbar .meta-pills { display: flex; gap: 6px; }

/* section / menu */
.layer-section { padding-top: 52px; scroll-margin-top: 64px; }
.layer-head { margin-bottom: 22px; }
.layer-eyebrow { display: inline-flex; align-items: center; gap: 9px; margin-bottom: 12px; flex-wrap: wrap; }
.layer-eyebrow .lyr {
  font-family: monospace;
  font-size: 11px; font-weight: 600; letter-spacing: .04em;
  color: var(--accent); background: var(--accent-bg);
  border: 1px solid var(--accent-line);
  padding: 3px 9px; border-radius: 999px;
}
.layer-eyebrow .tick { font-size: 11px; color: var(--faint); }
.layer-section h2 {
  font-size: 27px; font-weight: 700; letter-spacing: -0.02em;
  margin: 0 0 8px; color: var(--ink);
}
.layer-section .lede {
  font-size: 15.5px; color: var(--muted); margin: 0; max-width: 80ch;
  line-height: 1.65;
}
.subsection { padding-top: 8px; scroll-margin-top: 64px; }

/* group label inside content */
.block-label {
  display: flex; align-items: center; gap: 10px;
  font-size: 11.5px; text-transform: uppercase; letter-spacing: .07em;
  color: var(--muted); font-weight: 600;
  margin: 32px 0 12px;
}
.block-label::after { content: ""; flex: 1; height: 1px; background: var(--line); }
.block-label .soft { text-transform: none; letter-spacing: 0; color: var(--faint); font-weight: 500; }

/* ---------- cards ---------- */
.card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  box-shadow: var(--shadow-sm);
}
.card.pad { padding: 22px 24px; }

/* recommendation / verdict banner */
.rec {
  display: flex; align-items: center; gap: 16px;
  padding: 18px 22px; border-radius: var(--radius);
  background: var(--surface); border: 1px solid var(--line);
  border-left: 4px solid var(--ok); box-shadow: var(--shadow-sm);
}
.rec.warn { border-left-color: var(--warn); }
.rec.bad { border-left-color: var(--bad); }
.rec .badge { display: inline-flex; align-items: center; gap: 8px; font-weight: 700; font-size: 15px; color: var(--ok); }
.rec.warn .badge { color: var(--warn); }
.rec.bad .badge { color: var(--bad); }
.rec .badge .dot { width: 9px; height: 9px; border-radius: 50%; background: currentColor; box-shadow: 0 0 0 4px color-mix(in srgb, currentColor 18%, transparent); }
.rec .why { color: var(--muted); font-size: 13.5px; }
.rec .why code { color: var(--ink-2); }

/* prose */
.prose { font-size: 15.5px; line-height: 1.72; color: var(--ink-2); }
.prose p { margin: 0 0 14px; }
.prose strong, .prose b { color: var(--ink); font-weight: 600; }

/* numbered list (opportunities, steelman points) */
.opp-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 2px; }
.opp-list li {
  display: flex; gap: 14px; padding: 14px 4px;
  border-bottom: 1px solid var(--line);
  font-size: 14.5px; line-height: 1.6; color: var(--ink-2);
}
.opp-list li:last-child { border-bottom: none; }
.opp-list .idx {
  flex: none; width: 26px; height: 26px; border-radius: 7px;
  background: var(--accent-bg); color: var(--accent-ink);
  display: grid; place-items: center; font-size: 12px; font-weight: 600;
  font-family: monospace;
}

/* risk / assumptions grid */
.risk-grid { display: grid; gap: 14px; }
.risk-card {
  background: var(--surface); border: 1px solid var(--line);
  border-radius: var(--radius); padding: 18px 20px;
  display: grid; grid-template-columns: 132px 1fr; gap: 18px;
  box-shadow: var(--shadow-sm);
}
.risk-card .rk-side { display: flex; flex-direction: column; gap: 10px; }
.risk-card .statement { font-size: 14.5px; color: var(--ink); font-weight: 500; line-height: 1.55; }
.risk-card .derisk { font-size: 13.5px; color: var(--muted); margin-top: 8px; line-height: 1.6; }
.risk-card .derisk b { color: var(--ink-2); font-weight: 600; }
.conf-meter { display: flex; align-items: center; gap: 7px; font-size: 12px; font-weight: 600; }
.conf-meter .bars { display: flex; gap: 2px; }
.conf-meter .bars i { width: 5px; height: 12px; border-radius: 1px; background: var(--line-2); display: block; }
.conf-low .bars i:nth-child(1){ background: var(--low); }
.conf-medium .bars i:nth-child(-n+2){ background: var(--medium); }
.conf-high .bars i { background: var(--high); }
.conf-low { color: var(--low); } .conf-medium { color: var(--medium); } .conf-high { color: var(--high); }

/* regime list */
.regime-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 0; }
.regime-list li {
  display: flex; gap: 12px; padding: 13px 4px; align-items: flex-start;
  border-bottom: 1px solid var(--line); font-size: 14px; line-height: 1.6; color: var(--ink-2);
}
.regime-list li:last-child { border-bottom: none; }
.regime-list .mk { flex: none; margin-top: 2px; color: var(--accent); display: flex; }
.regime-list li.na { color: var(--muted); }
.regime-list li.na .mk { color: var(--faint); }

/* tags / chips */
.tag {
  display: inline-flex; align-items: center; gap: 5px;
  font-size: 11.5px; font-weight: 600; letter-spacing: .01em;
  padding: 3px 9px; border-radius: 6px; white-space: nowrap;
  border: 1px solid transparent; text-transform: capitalize;
}
.tag .d { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.t-must { color: var(--must); background: var(--must-bg); }
.t-should { color: var(--should); background: var(--should-bg); }
.t-could { color: var(--could); background: var(--could-bg); }
.rk-value { color: var(--value); background: var(--value-bg); }
.rk-usability { color: var(--usability); background: var(--usability-bg); }
.rk-feasibility { color: var(--feasibility); background: var(--feasibility-bg); }
.rk-viability { color: var(--viability); background: var(--viability-bg); }
.sev-P1, .sev-high { color: var(--p1); background: var(--p1-bg); }
.sev-P2, .sev-medium { color: var(--p2); background: var(--p2-bg); }
.sev-P3, .sev-low { color: var(--p3); background: var(--p3-bg); }
.tier-T1 { color: var(--t1); background: var(--t1-bg); border-color: var(--t1-line); }
.tier-T2 { color: var(--t2); background: var(--t2-bg); border-color: var(--t2-line); }
.tier-T3 { color: var(--t3); background: var(--t3-bg); border-color: var(--t3-line); }

.pill {
  display: inline-flex; align-items: center; gap: 6px;
  font-size: 11.5px; font-weight: 500;
  padding: 3px 10px; border-radius: 999px;
  background: var(--surface-2); border: 1px solid var(--line);
  color: var(--ink-2); white-space: nowrap;
}
.pill b { font-weight: 600; color: var(--ink); }
.pill .k { color: var(--muted); font-weight: 500; }
.pill.ok { color: var(--ok); border-color: color-mix(in srgb, var(--ok) 36%, var(--line)); background: var(--ok-bg); }
.pill.bad { color: var(--bad); border-color: color-mix(in srgb, var(--bad) 36%, var(--line)); background: var(--bad-bg); }
.pill.warn { color: var(--warn); border-color: color-mix(in srgb, var(--warn) 36%, var(--line)); background: var(--warn-bg); }
.pill.accent { color: var(--accent-ink); background: var(--accent-bg); border-color: var(--accent-line); }

.chips { display: flex; gap: 7px; flex-wrap: wrap; }
.chips .chip {
  font-size: 12px; padding: 4px 10px; border-radius: 7px;
  border: 1px solid var(--line); background: var(--surface-2); color: var(--ink-2);
}
.chips .chip.mono { font-family: monospace; font-size: 11.5px; }
.chips .chip.bad { color: var(--bad); background: var(--bad-bg); border-color: color-mix(in srgb, var(--bad) 30%, var(--line)); }

code, .code {
  font-family: monospace; font-size: 12.5px;
  background: var(--surface-2); border: 1px solid var(--line);
  padding: 1px 6px; border-radius: 5px; color: var(--accent-ink);
}
.path {
  display: inline-flex; align-items: center; gap: 7px;
  font-family: monospace; font-size: 11.5px;
  color: var(--muted); background: var(--surface-2);
  border: 1px solid var(--line); border-radius: 7px;
  padding: 4px 10px; word-break: break-all;
}
.path .mk { color: var(--faint); display: flex; flex: none; }

/* ---------- tables ---------- */
.tbl-wrap { border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; background: var(--surface); overflow-x: auto; }
table.data { width: 100%; border-collapse: collapse; font-size: 13.5px; }
table.data th {
  text-align: left; font-size: 10.5px; text-transform: uppercase; letter-spacing: .06em;
  color: var(--muted); font-weight: 600; padding: 11px 16px;
  background: var(--surface-2); border-bottom: 1px solid var(--line); white-space: nowrap;
}
table.data td { padding: 13px 16px; border-bottom: 1px solid var(--line); vertical-align: top; color: var(--ink-2); line-height: 1.55; }
table.data tr:last-child td { border-bottom: none; }
table.data tr:hover td { background: var(--surface-2); }
table.data td b { color: var(--ink); font-weight: 600; }

/* count stat strip */
.stat-strip {
  display: grid; grid-template-columns: repeat(4, 1fr);
  gap: 1px; background: var(--line);
  border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden;
}
.stat-strip .stat { background: var(--surface); padding: 16px 18px; display: flex; flex-direction: column; gap: 3px; }
.stat-strip .stat .v { font-size: 24px; font-weight: 700; letter-spacing: -0.02em; color: var(--ink); font-variant-numeric: tabular-nums; }
.stat-strip .stat .l { font-size: 11.5px; color: var(--muted); font-weight: 500; }
.stat-strip .stat.zero .v { color: var(--high); }

/* two-way coverage matrix */
.cov-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.cov-col { border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); padding: 16px 18px; }
.cov-col .cov-head { display: flex; align-items: center; gap: 9px; font-size: 12px; font-weight: 600; color: var(--ink); margin-bottom: 12px; }
.cov-col .cov-head .ct { color: var(--bad); font-variant-numeric: tabular-nums; }
.cov-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 7px; }
.cov-list li { display: flex; gap: 9px; align-items: center; font-size: 13px; color: var(--ink-2); padding: 8px 11px; border: 1px solid var(--line); border-radius: var(--radius-sm); background: var(--bad-bg); }
.cov-list li .mk { color: var(--bad); display: flex; flex: none; }
.cov-list li .v { font-family: monospace; font-size: 12px; }
.cov-list.empty li { background: var(--ok-bg); }
.cov-list.empty li .mk { color: var(--ok); }

/* ============================================================
   Epics (reused verbatim from base S1 viewer)
   ============================================================ */
.epic-list { display: flex; flex-direction: column; gap: 16px; }
.epic {
  background: var(--surface); border: 1px solid var(--line);
  border-radius: var(--radius); overflow: hidden;
  box-shadow: var(--shadow-sm);
  transition: box-shadow .15s, border-color .15s;
}
.epic.open { box-shadow: var(--shadow); border-color: var(--line-2); }
.epic-head { display: flex; align-items: center; gap: 14px; padding: 18px 22px; cursor: pointer; user-select: none; }
.epic-head:hover { background: var(--surface-2); }
.epic-head .chev { flex: none; color: var(--faint); transition: transform .2s; display: flex; }
.epic.open .epic-head .chev { transform: rotate(90deg); color: var(--accent); }
.epic-head .titles { min-width: 0; }
.epic-head .eid { font-family: monospace; font-size: 11.5px; font-weight: 600; color: var(--accent); letter-spacing: .01em; }
.epic-head .etitle { font-size: 16.5px; font-weight: 600; color: var(--ink); letter-spacing: -0.01em; margin-top: 1px; }
.epic-head .epic-meta { margin-left: auto; display: flex; align-items: center; gap: 8px; flex: none; }
.epic-body { display: none; padding: 4px 22px 22px; border-top: 1px solid var(--line); }
.epic.open .epic-body { display: block; }

.epic-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 22px; margin-top: 18px; }
.epic-grid .full { grid-column: 1 / -1; }
.field-label { font-size: 11px; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); font-weight: 600; margin-bottom: 8px; }
.field-body { font-size: 14px; color: var(--ink-2); line-height: 1.62; }
.field-body .why { color: var(--muted); font-style: italic; display: block; margin-top: 6px; }

.scope-cols { display: grid; gap: 12px; }
.scope-row { display: flex; gap: 10px; align-items: baseline; }
.scope-row .sk { flex: none; width: 92px; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .05em; }
.scope-row.in .sk { color: var(--applies); }
.scope-row.outx .sk { color: var(--muted); }
.scope-row.outd .sk { color: var(--faint); }
.scope-row .sv { font-size: 13.5px; color: var(--ink-2); line-height: 1.7; }
.scope-row .sv .x { color: var(--faint); }

.story-rows { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; }
.story-row {
  display: flex; align-items: center; gap: 13px;
  padding: 14px 16px; border: 1px solid var(--line);
  border-radius: var(--radius-sm); background: var(--surface-2);
  cursor: pointer; text-align: left; width: 100%;
  font: inherit; color: inherit;
  transition: border-color .12s, background .12s, transform .08s;
}
.story-row:hover { border-color: var(--accent-line); background: var(--accent-bg); }
.story-row:active { transform: translateY(1px); }
.story-row .sid { font-family: monospace; font-size: 11px; font-weight: 600; color: var(--muted); flex: none; width: 152px; }
.story-row .stitle { font-size: 14px; font-weight: 500; color: var(--ink); min-width: 0; flex: 1; }
.story-row .srt { display: flex; align-items: center; gap: 9px; flex: none; }
.story-row .pts { font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; display: inline-flex; align-items: center; gap: 5px; }
.story-row .go { color: var(--faint); display: flex; transition: transform .12s, color .12s; }
.story-row:hover .go { color: var(--accent); transform: translateX(2px); }
.story-row.missing { cursor: default; }
.story-row.missing:hover { border-color: var(--bad); background: var(--bad-bg); }

.sc-list { display: grid; gap: 10px; }
.sc-item {
  display: grid; grid-template-columns: 1fr auto; gap: 6px 16px;
  padding: 13px 16px; border: 1px solid var(--line); border-radius: var(--radius-sm);
  background: var(--surface-2);
}
.sc-item .m { font-size: 13.5px; color: var(--ink); font-weight: 500; }
.sc-item .meth { font-size: 12px; color: var(--muted); grid-column: 1; }
.sc-item .tgt { grid-row: 1 / 3; align-self: center; text-align: right; }
.sc-item .tgt .t { font-family: monospace; font-size: 13px; font-weight: 600; color: var(--high); }
.sc-item .tgt .b { font-size: 11px; color: var(--faint); }

/* ============================================================
   Diagram (inline SVG preview)
   ============================================================ */
.diagram-wrap {
  border: 1px solid var(--line); border-radius: var(--radius);
  background: var(--surface); box-shadow: var(--shadow-sm);
  padding: 18px; overflow-x: auto;
}
.diagram-wrap svg { max-width: 100%; height: auto; display: block; }
.diagram-cap { font-size: 13px; color: var(--muted); margin: 10px 2px 0; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }

/* ============================================================
   Generic collapsible tree (ported from contract-debug-viewer)
   ============================================================ */
.gtree { font-size: 13.5px; }
.gtree .grow { display: flex; gap: 10px; padding: 3px 0; align-items: baseline; }
.gtree .gkey {
  color: var(--muted); font-weight: 600; min-width: 150px; max-width: 260px; word-break: break-word;
  font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 12.5px;
}
.gtree .gval { flex: 1; min-width: 0; word-break: break-word; color: var(--ink-2); }
.gtree .gval.num { color: var(--accent-ink); font-weight: 600; }
.gtree .gval.null { color: var(--faint); font-style: italic; }
.gtree .gchildren { margin-left: 14px; border-left: 1px solid var(--line); padding-left: 12px; }
.gtree details { margin: 2px 0; }
.gtree details > summary { cursor: pointer; list-style: none; padding: 2px 0; }
.gtree details > summary::-webkit-details-marker { display: none; }
.gtree details > summary::before { content: '\25B8'; color: var(--faint); display: inline-block; width: 1em; transition: transform .12s; }
.gtree details[open] > summary::before { transform: rotate(90deg); }
.gtree .gcount { color: var(--faint); font-weight: 500; }
.gtree .glong { white-space: pre-wrap; background: var(--surface-2); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; color: var(--ink-2); font-size: 13px; }

/* ============================================================
   Quality-Gate Board
   ============================================================ */
.board-rollup {
  display: flex; align-items: center; gap: 16px;
  padding: 18px 22px; border-radius: var(--radius);
  border: 1px solid var(--line); border-left: 4px solid var(--gate-pend);
  background: var(--surface); box-shadow: var(--shadow-sm);
}
.board-rollup.GREEN { border-left-color: var(--gate-green); }
.board-rollup.AMBER { border-left-color: var(--gate-amber); }
.board-rollup.RED { border-left-color: var(--gate-red); }
.board-rollup .ro-badge { display: inline-flex; align-items: center; gap: 9px; font-weight: 700; font-size: 16px; }
.board-rollup.GREEN .ro-badge { color: var(--gate-green); }
.board-rollup.AMBER .ro-badge { color: var(--gate-amber); }
.board-rollup.RED .ro-badge { color: var(--gate-red); }
.board-rollup.PENDING .ro-badge { color: var(--gate-pend); }
.board-rollup .ro-badge .dot { width: 11px; height: 11px; border-radius: 50%; background: currentColor; box-shadow: 0 0 0 5px color-mix(in srgb, currentColor 16%, transparent); }
.board-rollup .ro-counts { display: flex; gap: 10px; flex-wrap: wrap; }

.gate-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(232px, 1fr)); gap: 12px; }
.gate-cell {
  border: 1px solid var(--line); border-radius: var(--radius);
  background: var(--surface); box-shadow: var(--shadow-sm);
  padding: 0; overflow: hidden; text-align: left; width: 100%;
  font: inherit; color: inherit; cursor: pointer;
  transition: border-color .12s, transform .08s, box-shadow .12s;
  border-top: 3px solid var(--gate-pend);
}
.gate-cell:hover { box-shadow: var(--shadow); border-color: var(--line-2); }
.gate-cell:active { transform: translateY(1px); }
.gate-cell.G { border-top-color: var(--gate-green); }
.gate-cell.A { border-top-color: var(--gate-amber); }
.gate-cell.R { border-top-color: var(--gate-red); }
.gate-cell.P { border-top-color: var(--gate-pend); }
.gate-cell .gc-top { padding: 13px 15px 10px; display: flex; align-items: center; gap: 9px; }
.gate-cell .gc-id { font-family: monospace; font-size: 11px; font-weight: 700; flex: none; padding: 2px 7px; border-radius: 6px; }
.gate-cell.G .gc-id { color: var(--gate-green); background: var(--gate-green-bg); }
.gate-cell.A .gc-id { color: var(--gate-amber); background: var(--gate-amber-bg); }
.gate-cell.R .gc-id { color: var(--gate-red); background: var(--gate-red-bg); }
.gate-cell.P .gc-id { color: var(--gate-pend); background: var(--gate-pend-bg); }
.gate-cell .gc-name { font-size: 13px; font-weight: 600; color: var(--ink); min-width: 0; }
.gate-cell .gc-state { margin-left: auto; flex: none; width: 12px; height: 12px; border-radius: 50%; background: var(--gate-pend); }
.gate-cell.G .gc-state { background: var(--gate-green); }
.gate-cell.A .gc-state { background: var(--gate-amber); }
.gate-cell.R .gc-state { background: var(--gate-red); }
.gate-cell .gc-body { padding: 0 15px 13px; }
.gate-cell .gc-headline { font-size: 12.5px; color: var(--muted); line-height: 1.5; }
.gate-cell .gc-foot { padding: 9px 15px; border-top: 1px solid var(--line); background: var(--surface-2); display: flex; align-items: center; gap: 8px; font-size: 11px; color: var(--faint); }
.gate-cell .gc-foot .lvl { font-family: monospace; }
.gate-cell .gc-verdict { margin-left: auto; font-family: monospace; font-weight: 600; }

.board-empty {
  border: 1px dashed var(--line-2); border-radius: var(--radius);
  background: var(--surface); padding: 36px 28px; text-align: center; color: var(--muted);
}
.board-empty .be-title { font-weight: 600; color: var(--ink-2); font-size: 15px; margin-bottom: 6px; }
.board-empty .be-sub { font-size: 13px; color: var(--muted); line-height: 1.6; max-width: 64ch; margin: 0 auto; }

/* pending stub stage card */
.pending-card {
  border: 1px dashed var(--line-2); border-radius: var(--radius);
  background: var(--surface); padding: 26px 26px; color: var(--muted);
  display: flex; gap: 16px; align-items: flex-start;
}
.pending-card .pc-mk { flex: none; width: 38px; height: 38px; border-radius: 10px; background: var(--surface-2); display: grid; place-items: center; color: var(--faint); }
.pending-card .pc-title { font-weight: 600; color: var(--ink-2); font-size: 16px; }
.pending-card .pc-sub { font-size: 13.5px; color: var(--muted); margin-top: 4px; line-height: 1.6; }
.pending-card .pc-meta { margin-top: 12px; display: flex; gap: 8px; flex-wrap: wrap; }

/* ============================================================
   Reader (slide-in, reused verbatim from base S1 viewer)
   ============================================================ */
.reader-scrim {
  position: fixed; inset: 0; z-index: 60;
  background: rgba(10,18,32,.42);
  backdrop-filter: blur(2px);
  opacity: 0; pointer-events: none; transition: opacity .22s;
}
.reader-scrim.show { opacity: 1; pointer-events: auto; }
.reader {
  position: fixed; top: 0; right: 0; bottom: 0; z-index: 61;
  width: min(760px, 94vw);
  background: var(--bg);
  border-left: 1px solid var(--line-2);
  box-shadow: var(--shadow-lg);
  transform: translateX(100%); transition: transform .26s cubic-bezier(.4,0,.1,1);
  display: flex; flex-direction: column;
}
.reader.show { transform: translateX(0); }
.reader-top { display: flex; align-items: center; gap: 12px; padding: 16px 26px; border-bottom: 1px solid var(--line); background: var(--surface); }
.reader-top .back {
  display: inline-flex; align-items: center; gap: 7px;
  border: 1px solid var(--line-2); background: var(--surface);
  padding: 7px 12px; border-radius: var(--radius-sm);
  font: inherit; font-size: 12.5px; font-weight: 600; color: var(--ink-2); cursor: pointer;
}
.reader-top .back:hover { border-color: var(--accent); color: var(--accent); }
.reader-top .rmeta { margin-left: auto; display: flex; align-items: center; gap: 8px; }
.reader-body { overflow-y: auto; padding: 30px 32px 60px; }
.reader-body::-webkit-scrollbar { width: 10px; }
.reader-body::-webkit-scrollbar-thumb { background: var(--line-2); border-radius: 8px; border: 3px solid var(--bg); }

.reader-eyebrow { font-family: monospace; font-size: 11.5px; color: var(--accent); font-weight: 600; }
.reader h3 { font-size: 23px; font-weight: 700; letter-spacing: -0.02em; margin: 8px 0 14px; line-height: 1.25; color: var(--ink); }
.reader .story-pills { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 22px; }

.user-story-card { background: var(--accent-bg); border: 1px solid var(--accent-line); border-radius: var(--radius); padding: 18px 20px; margin-bottom: 8px; }
.user-story-card .usc-line { display: flex; gap: 14px; align-items: baseline; font-size: 15.5px; line-height: 1.6; color: var(--ink); padding: 3px 0; }
.user-story-card .usc-line + .usc-line { border-top: 1px solid var(--accent-line); margin-top: 6px; padding-top: 9px; }
.user-story-card .usc-line em { flex: none; width: 58px; font-style: normal; color: var(--accent-ink); font-weight: 600; font-size: 11px; text-transform: uppercase; letter-spacing: .05em; white-space: nowrap; padding-top: 3px; }

.r-section { margin-top: 30px; }
.r-section > .rh { display: flex; align-items: center; gap: 9px; margin-bottom: 14px; }
.r-section > .rh .rt { font-size: 12px; text-transform: uppercase; letter-spacing: .07em; color: var(--ink); font-weight: 600; }
.r-section > .rh .rc { font-size: 11px; color: var(--faint); font-variant-numeric: tabular-nums; }
.r-section > .rh::after { content: ""; flex: 1; height: 1px; background: var(--line); }
.r-context { font-size: 14px; color: var(--muted); line-height: 1.65; }

.scenario { border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; margin-bottom: 12px; background: var(--surface); }
.scenario-head { display: flex; align-items: center; gap: 10px; padding: 13px 16px; background: var(--surface-2); border-bottom: 1px solid var(--line); }
.scenario-head .sname { font-size: 13.5px; font-weight: 600; color: var(--ink); }
.scenario-head .stype { margin-left: auto; font-family: monospace; font-size: 10.5px; padding: 2px 8px; border-radius: 5px; font-weight: 500; white-space: nowrap; flex: none; }
.stype.happy { color: var(--applies); background: var(--applies-bg); }
.stype.error { color: var(--p1); background: var(--p1-bg); }
.stype.audit { color: var(--usability); background: var(--usability-bg); }
.stype.idem { color: var(--accent); background: var(--accent-bg); }
.scenario-body { padding: 6px 16px 14px; }
.gwt { display: grid; grid-template-columns: 64px 1fr; gap: 0; }
.gwt .gk { font-family: monospace; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .04em; padding: 9px 0; color: var(--accent); }
.gwt .gk.given { color: var(--viability); }
.gwt .gk.when { color: var(--feasibility); }
.gwt .gk.then { color: var(--applies); }
.gwt .gv { padding: 9px 0; font-size: 13.5px; color: var(--ink-2); line-height: 1.6; border-bottom: 1px solid var(--line); }
.gwt > .gv:last-child, .gwt > div:last-child { border-bottom: none; }
.gwt .gv ul { margin: 0; padding-left: 17px; }
.gwt .gv li { margin: 3px 0; }
.gwt .gv li::marker { color: var(--faint); }

.bg-list { display: grid; gap: 8px; }
.bg-item { display: grid; grid-template-columns: 170px 1fr; gap: 14px; padding: 13px 16px; border: 1px solid var(--line); border-radius: var(--radius-sm); background: var(--surface); }
.bg-item .bk { display: flex; align-items: center; gap: 8px; }
.bg-item .bk .label { font-size: 13px; font-weight: 500; color: var(--ink); text-transform: capitalize; }
.bg-item .bj { font-size: 13px; color: var(--muted); line-height: 1.55; }
.bg-item .bj .extra { display: block; margin-top: 6px; color: var(--ink-2); font-size: 12.5px; }
.bg-item .bj .extra b { color: var(--ink); }
.status-dot { display: inline-flex; align-items: center; gap: 6px; font-size: 11px; font-weight: 600; padding: 2px 9px; border-radius: 6px; }
.status-dot.applies { color: var(--applies); background: var(--applies-bg); }
.status-dot.na { color: var(--na); background: var(--na-bg); }
.status-dot .d { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }

.dor-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
.dor-item { display: flex; align-items: center; gap: 9px; font-size: 13px; color: var(--ink-2); padding: 9px 13px; border: 1px solid var(--line); border-radius: var(--radius-sm); background: var(--surface); }
.dor-item .mk { flex: none; width: 18px; height: 18px; border-radius: 5px; display: grid; place-items: center; font-size: 11px; color: #fff; }
.dor-item.y .mk { background: var(--applies); }
.dor-item.n .mk { background: var(--bad); }
.dor-item .lbl { text-transform: capitalize; }

.dep-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.dep-box .field-label { margin-bottom: 9px; }

/* provenance */
.note-card {
  background: var(--should-bg);
  border: 1px solid color-mix(in srgb, var(--should) 22%, var(--line));
  border-left: 4px solid var(--should);
  border-radius: var(--radius); padding: 20px 24px;
  font-size: 14px; line-height: 1.7; color: var(--ink-2);
}
.note-card .nh { display: flex; align-items: center; gap: 9px; font-weight: 700; color: var(--should); margin-bottom: 8px; font-size: 13.5px; text-transform: uppercase; letter-spacing: .04em; }
.note-card code { background: color-mix(in srgb, var(--surface) 70%, transparent); }

.signoff { margin-top: 22px; padding: 22px 24px; border: 1px dashed var(--line-2); border-radius: var(--radius); background: var(--surface); font-size: 13.5px; color: var(--muted); line-height: 1.8; }
.signoff .so-title { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--ink); font-weight: 600; margin-bottom: 10px; }
.signoff .so-line { display: flex; gap: 14px; flex-wrap: wrap; align-items: center; }
.signoff .blank { border-bottom: 1px solid var(--line-2); min-width: 120px; display: inline-block; }
.signoff .opts { display: flex; gap: 14px; }
.signoff .opt { display: inline-flex; align-items: center; gap: 6px; }
.signoff .box { width: 13px; height: 13px; border: 1.5px solid var(--line-2); border-radius: 3px; display: inline-block; }
.signoff .produced { margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--line); font-size: 12.5px; }

/* search highlight + empty */
.no-results { display: none; text-align: center; padding: 60px 20px; color: var(--muted); }
.no-results.show { display: block; }
.search-hidden { display: none !important; }

/* ============================================================
   Responsive
   ============================================================ */
.menu-btn { display: none; }
.scrim-nav { display: none; }

@media (max-width: 1080px) {
  .epic-grid { grid-template-columns: 1fr; }
  .dep-grid, .dor-grid, .cov-grid { grid-template-columns: 1fr; }
  .content, .topbar-inner { padding-left: 32px; padding-right: 32px; }
}

@media (max-width: 860px) {
  .app { grid-template-columns: 1fr; }
  .sidebar {

e-snapshots.md", "slug": "order-immutable-snapshots", "status": "Accepted"}, {"content": "No distributed rollback; failure paths emit compensating release; unpaid reservations auto-release on TTL.", "id": "ADR-004", "path": "design/architecture/ADRs/ADR-004-failure-not-rollback.md", "slug": "failure-not-rollback", "status": "Accepted"}, {"content": "Mock PSP behind client_psp gateway in checkout-service only; no PAN/CVV; one-adapter swap to a real PSP.", "id": "ADR-005", "path": "design/architecture/ADRs/ADR-005-mock-psp-gateway.md", "slug": "mock-psp-gateway", "status": "Accepted"}, {"content": "Cross-cutting append-only audit keyed by audit_id; per-service table + shared topic; retention 5y/1y.", "id": "ADR-006", "path": "design/architecture/ADRs/ADR-006-append-only-audit.md", "slug": "append-only-audit", "status": "Accepted"}, {"content": "MVP: no standalone Orchestrator for the single checkout journey; checkout-service orchestrates synchronously. Deviation accepted; revisit on a 2nd cross-context journey. Recorded in architecture_smells.", "id": "ADR-007", "path": "design/architecture/ADRs/ADR-007-sync-orchestration-no-orchestrator.md", "slug": "sync-orchestration-no-orchestrator", "status": "Accepted"}, {"content": "Added in the S2.5 loop-back (RT-2): transactional outbox per producing service + idempotent order.create/capture retry close the dual-write gap and the partial-failure window; TTL is the backstop.", "id": "ADR-008", "path": "design/architecture/ADRs/ADR-008-transactional-outbox-idempotent-retry.md", "slug": "transactional-outbox-idempotent-retry", "status": "Accepted"}], "architecture_smells": [{"check": "Contexts split by business workstream, not tech layer", "resolution": "n/a", "status": "pass"}, {"check": "Each aggregate owns one consistency boundary; no god-aggregate", "resolution": "n/a", "status": "pass"}, {"check": "Domain logic in the domain layer, not handlers (no anemic domain)", "resolution": "n/a", "status": "pass"}, {"check": "Every co function pathChip(text) { return '<span class="path mono"><span class="mk">' + ICON.doc + '</span>' + esc(text) + '</span>'; }
function prioTag(p) {
  const k = String(p || '').toLowerCase();
  const c = k === 'must' ? 't-must' : k === 'should' ? 't-should' : k === 'could' ? 't-could' : 't-could';
  return '<span class="tag ' + c + '"><span class="d"></span>' + esc(p) + '</span>';
}
function tierBadge(t) {
  const k = String(t || '').toUpperCase();

function sevTag(s) {
  const k = String(s || '').toLowerCase();
  const cls = (k === 'p1' || k === 'high') ? 'sev-P1' : (k === 'p2' || k === 'medium') ? 'sev-P2' : 'sev-P3';

const KV = (k, v) => '<span class="pill"><span class="k">' + esc(k) + '</span> <b>' + esc(v) + '</b></span>';

/* status -> ok|warn|bad class for banner / pill */
const OK = ['proceed', 'ready-for-tl', 'ready-for-implementation', 'pass', 'promote', 'resolved', 'present', 'complete', 'done', 'green'];
const WARNV = ['needs-work', 'conditional', 'hold', 'draft', 'revise', 'partial', 'pending', 'amber'];
const BADV = ['do-not-build', 'block', 'blocked', 'fail', 'error', 'rollback', 'rejected', 'red', 'hardfail'];
function statusKind(v) {
  const k = String(v == null ? '' : v).toLowerCase();
  if (OK.indexOf(k) >= 0) return 'ok';
  if (WARNV.indexOf(k) >= 0) return 'warn';
  if (BADV.indexOf(k) >= 0) return 'bad';
  return '';
}

/* ============================================================
   Generic collapsible tree (ported from render_contract_viewer.py)
   ============================================================ */
function gtreeNode(key, val, depth) {
  if (val === null || typeof val !== 'object') {
    let cls = 'gval';
    let body;
    if (val === null) { cls += ' null'; body = 'null'; }
    else if (typeof val === 'number') { cls += ' num'; body = esc(val); }
    else if (typeof val === 'boolean') { body = esc(String(val)); }
    else { const s = String(val); body = s.length > 160 ? '<span class="glong">' + esc(s) + '</span>' : esc(s); }
    return '<div class="grow"><span class="gkey">' + esc(key) + '</span><span class="' + cls + '">' + body + '</span></div>';
  }
  const isArr = Array.isArray(val);
  const keys = isArr ? val.map((_, i) => i) : Object.keys(val);
  const label = esc(key) + ' <span class="gcount">' + (isArr ? ('[' + val.length + ']') : ('{' + keys.length + '}')) + '</span>';
  const inner = keys.map(k => gtreeNode(isArr ? '[' + k + ']' : k, val[k], depth + 1)).join('');
  const open = depth < 1 ? ' open' : '';
  return '<details' + open + '><summary><span class="gkey">' + label + '</span></summary><div class="gchildren">' + inner + '</div></details>';
}
function gtree(obj) {
  if (!isObj(obj)) return '<div class="gtree">' + gtreeNode('(value)', obj, 0) + '</div>';
  return '<div class="gtree">' + Object.keys(obj).map(k => gtreeNode(k, obj[k], 0)).join('') + '</div>';
}

    (sec.tier ? tierBadge(sec.tier) : '') +

  return '<div class="subsection section-block" id="sec-' + esc(sec.id) + '" data-search="' + searchText + '">' +

function menuMeta(menu) {
  const ownerRow = ledgerFor(menu.stage);
  return '<span class="pill">' + esc(menu.stage) + '</span>' +
    (ownerRow ? '<span class="pill accent"><span class="k">gate</span> <b>' + esc(ownerRow.gate) + '</b></span>' +
      '<span class="pill"><span class="k">owner</span> <b>' + esc(ownerRow.owner) + '</b></span>' : '') +
    (menu.present ? '' : '<span class="pill warn">pending</span>');
}
function ledgerFor(stage) {
  return arr(RUN.gate_ledger).find(g => g.stage && stage && (g.stage === stage || stage.indexOf(g.stage) >= 0)) || null;
}

function renderMenus() {
  let h = '';
  MENUS.forEach(menu => {
    const secs = SECTIONS.filter(s => s.menu === menu.id).filter(s => !s.sub_of);
    h += '<section class="layer-section menu-block" id="menu-' + esc(menu.id) + '" data-menu="' + esc(menu.id) + '" data-search="' + esc((menu.label + ' ' + menu.stage).toLowerCase()) + '">' +
      '<div class="layer-head"><div class="layer-eyebrow"><span class="lyr">' + esc(menu.stage) + '</span>' +
      '<span class="tick">' + menuMeta(menu) + '</span></div>' +
      '<h2>' + esc(menu.label) + '</h2></div>';
    if (!menu.present && !secs.length) {
      h += RENDER.pending({ title: menu.label, source_path: menu.stage, payload: { stage: menu.stage, note: 'This stage has not run in this pipeline yet.' } });
    } else {
      h += secs.map(sectionHtml).join('');
    }
    h += '</section>';
  });
  el('menuRoot').innerHTML = h;

  /* wire epic accordions + story rows */
  document.querySelectorAll('.epic-head').forEach(head => {
    const toggle = () => head.parentElement.classList.toggle('open');
    head.addEventListener('click', toggle);
    head.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggle(); } });
  });
  document.querySelectorAll('.story-row[data-story]').forEach(r => {
    r.addEventListener('click', () => openStory(r.getAttribute('data-story')));
  });
  /* wire gate cells -> open baked JSON in reader */
  document.querySelectorAll('.gate-cell[data-gate]').forEach(cell => {
    cell.addEventListener('click', () => {
      const sec = SECTIONS.find(s => s.kind === 'gate_board');
      if (!sec) return;
      const g = arr((sec.payload || {}).gates)[Number(cell.getAttribute('data-gate'))];
      if (!g) return;
      openGate(g);
    });
  });
}

function openGate(g) {
  lastFocus = document.activeElement;
  const st = String(g.status || 'P').toUpperCase();
  el('readerMeta').innerHTML = '<span class="pill mono">' + esc(g.id) + '</span><span class="pill ' +
    (st === 'G' ? 'ok' : st === 'A' ? 'warn' : st === 'R' ? 'bad' : '') + '">' + esc(g.verdict == null ? st : g.verdict) + '</span>';
  el('readerBody').innerHTML = '<div class="reader-eyebrow mono">' + esc(g.id) + (g.level ? ' · ' + esc(g.level) : '') + '</div>' +
    '<h3>' + esc(g.name) + '</h3>' +
    '<div class="story-pills">' +
    '<span class="pill"><span class="k">status</span> <b>' + esc(st) + '</b></span>' +
    (g.verdict != null ? '<span class="pill"><span class="k">verdict</span> <b>' + esc(g.verdict) + '</b></span>' : '') +
    (g.gate_policy ? '<span class="pill"><span class="k">policy</span> <b>' + esc(g.gate_policy) + '</b></span>' : '') +
    '</div>' +
    (g.headline ? '<div class="r-context">' + esc(g.headline) + '</div>' : '') +
    (g.source ? '<div style="margin-top:14px;">' + pathChip(g.source) + '</div>' : '') +
    '<div class="r-section"><div class="rh"><span class="rt">Gate JSON</span></div>' + gtree(g.detail) + '</div>';
  el('readerBody').scrollTop = 0;
  el('reader').classList.add('show');
  el('reader').setAttribute('aria-hidden', 'false');
  el('readerScrim').classList.add('show');
  document.body.style.overflow = 'hidden';
  el('readerBack').focus();
}

/* ============================================================

   ============================================================ */
function gateStatusForMenu(menu) {
  /* derive a sidebar gate dot: pending menus -> p; gate_board menu -> rollup; else none */
  const board = SECTIONS.find(s => s.menu === menu.id && s.kind === 'gate_board');
  if (board) {
    const ro = String((board.payload || {}).rollup || 'PENDING').toUpperCase();
    return ro === 'GREEN' ? 'g' : ro === 'AMBER' ? 'a' : ro === 'RED' ? 'r' : 'p';
  }
  if (!menu.present) return 'p';
  return '';
}

          h += '<a class="nav-item sub" href="#" data-epic-jump="' + esc(e.id) + '">' + esc(e.id.replace('EPIC-', '')) + '<span class="pip">' + ids.length + '</span></a>';

            const s = (sec.payload.stories || {})[sid];
            const label = s ? s.title : sid;
            const tail = String(sid).replace(/^STORY-[A-Z]+-/, '').replace(/^EPIC-[A-Z]+-/, '');
            h += '<a class="nav-item sub2" href="#" data-story-jump="' + esc(sid) + '" title="' + esc(label) + '">' +
              '<span class="snum mono">' + esc(tail) + '</span><span class="slabel">' + esc(label) + '</span></a>';
          });
        });
      } else if (secs.length > 1) {
        h += '<a class="nav-item sub" href="#sec-' + esc(sec.id) + '" data-target="sec-' + esc(sec.id) + '">' + esc(sec.title) + '</a>';
      }
    });
  });
  el('navTree').innerHTML = h;

  document.querySelectorAll('[data-epic-jump]').forEach(a => {
    a.addEventListener('click', e => {
      e.preventDefault();
      const card = document.querySelector('.epic[data-epic="' + a.getAttribute('data-epic-jump') + '"]');
      if (card) { card.classList.add('open'); window.scrollTo({ top: card.getBoundingClientRect().top + window.scrollY - 72, behavior: 'smooth' }); }
      closeNavMobile();
    });
  });
  document.querySelectorAll('[data-story-jump]').forEach(a => {
    a.addEventListener('click', e => {
      e.preventDefault();
      const sid = a.getAttribute('data-story-jump');
      const s = STORY_INDEX[sid];
      if (s && s.epic_id) { const card = document.querySelector('.epic[data-epic="' + s.epic_id + '"]'); if (card) card.classList.add('open'); }
      openStory(sid);
      closeNavMobile();
    });
  });
  document.querySelectorAll('.nav-item[data-target]').forEach(a => {
    a.addEventListener('click', e => {
      e.preventDefault();
      const t = el(a.getAttribute('data-target'));
      if (t) window.scrollTo({ top: t.getBoundingClientRect().top + window.scrollY - 64, behavior: 'smooth' });
      closeNavMobile();
    });
  });
}

function setupScrollSpy() {
  const items = [...document.querySelectorAll('.nav-item[data-target]')];
  const targets = items.map(i => el(i.getAttribute('data-target'))).filter(Boolean);
  const byTarget = id => items.find(i => i.getAttribute('data-target') === id);
  function update() {
    const mid = window.scrollY + window.innerHeight * 0.28;
    let current = targets[0];
    for (const t of targets) { if (t.offsetTop <= mid) current = t; }
    items.forEach(i => i.classList.remove('active'));
    if (current) { const it = byTarget(current.id); if (it) it.classList.add('active'); }
  }
  let ticking = false;
  window.addEventListener('scroll', () => { if (!ticking) { requestAnimationFrame(() => { update(); ticking = false; }); ticking = true; } }, { passive: true });
  update();
}

/* ============================================================
   Search / filter
   ============================================================ */
function setupSearch() {
  const input = el('searchInput'), wrap = el('search'), clear = el('searchClear');
  function apply(q) {
    q = q.trim().toLowerCase();
    wrap.classList.toggle('has-value', q.length > 0);
    let anyVisible = false;
    document.querySelectorAll('.menu-block').forEach(block => {
      const epicCards = [...block.querySelectorAll('.epic')];
      let blockMatch = !q || (block.getAttribute('data-search') || '').includes(q);
      let inner = false;
      block.querySelectorAll('.section-block').forEach(sb => {
        const stxt = (sb.getAttribute('data-search') || '') + ' ' + sb.textContent.toLowerCase();
        const hit = !q || blockMatch || stxt.includes(q);
        sb.classList.toggle('search-hidden', !hit);
        if (hit && q) inner = true;
      });
      epicCards.forEach(card => {
        const txt = ((card.getAttribute('data-search') || '') + ' ' + card.textContent).toLowerCase();
        const hit = !q || blockMatch || txt.includes(q);
        card.classList.toggle('search-hidden', !hit);
        if (hit && q) { inner = true; card.classList.add('open'); }
      });
      const show = !q || blockMatch || inner;
      block.classList.toggle('search-hidden', !show);
      if (show) anyVisible = true;
    });
    el('noResults').classList.toggle('show', !!q && !anyVisible);
  }
  input.addEventListener('input', () => apply(input.value));
  clear.addEventListener('click', () => { input.value = ''; apply(''); input.focus(); });
  input.addEventListener('keydown', e => { if (e.key === 'Escape') { input.value = ''; apply(''); input.blur(); } });
}

/* ============================================================
   Theme / expand / mobile / keys
   ============================================================ */
function applyTheme(t) { document.documentElement.setAttribute('data-theme', t); el('themeIcon').innerHTML = t === 'dark' ? ICON.sun : ICON.moon; }
function setupTheme() {
  let theme = 'light';
  try { theme = localStorage.getItem('drc-theme') || 'light'; } catch (e) {}
  applyTheme(theme);
  el('themeToggle').addEventListener('click', () => {
    theme = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
    applyTheme(theme);
    try { localStorage.setItem('drc-theme', theme); } catch (e) {}
  });
}
function setupExpand() {
  const btn = el('expandAll');
  function set(on) {
    btn.setAttribute('aria-pressed', String(on));
    el('expandLabel').textContent = on ? 'Collapse all' : 'Expand all';
    document.querySelectorAll('.epic').forEach(c => c.classList.toggle('open', on));
    document.querySelectorAll('.gtree details').forEach(d => { d.open = on; });
  }
  btn.addEventListener('click', () => set(btn.getAttribute('aria-pressed') !== 'true'));
  return set;
}
function closeNavMobile() { el('sidebar').classList.remove('open'); el('scrimNav').classList.remove('show'); }
function setupMobileNav() {
  el('menuBtn').addEventListener('click', () => { el('sidebar').classList.add('open'); el('scrimNav').classList.add('show'); });
  el('scrimNav').addEventListener('click', closeNavMobile);
}
function setupReader() { el('readerBack').addEventListener('click', closeStory); el('readerScrim').addEventListener('click', closeStory); }
function setupKeys(setExpand) {
  document.addEventListener('keydown', e => {
    const typing = /^(input|textarea)$/i.test(e.target.tagName);
    if (e.key === 'Escape') {
      if (el('reader').classList.contains('show')) { closeStory(); return; }
      if (el('sidebar').classList.contains('open')) { closeNavMobile(); return; }
    }
    if (typing) return;
    if (e.key === '/') { e.preventDefault(); el('searchInput').focus(); return; }
    if (e.key === 'e' || e.key === 'E') { const btn = el('expandAll'); setExpand(btn.getAttribute('aria-pressed') !== 'true'); return; }
    if (e.key === 'g' || e.key === 'G') { window.scrollTo({ top: 0, behavior: 'smooth' }); }
  });
}

/* ============================================================
   Legend
   ============================================================ */
function renderLegend() {
  el('legend').innerHTML =
    '<div class="legend-title">Gate roll-up</div>' +
    '<div class="row">' +
    '<span class="pill ok">G</span><span class="pill warn">A</span><span class="pill bad">R</span><span class="pill">pending</span>' +
    '</div>' +
    '<div class="legend-title" style="margin-top:6px;">Severity</div>' +
    '<div class="row"><span class="tag sev-P1">P1</span><span class="tag sev-P2">P2</span><span class="tag sev-P3">P3</span></div>';
}

/* ============================================================
   Init
   ============================================================ */
renderHeader();
renderMenus();
renderOverview();
buildNav();
renderLegend();
setupScrollSpy();
setupSearch();
setupTheme();
const setExpand = setupExpand();
setupMobileNav();
setupReader();
setupKeys(setExpand);

})();
</script>
