    <script>
      document.addEventListener("DOMContentLoaded", async function () {
        const loading = document.getElementById("__bundler_loading");
        function setStatus(msg) {
          if (loading) loading.textContent = msg;
        }

        // Error sink persists across replaceWith since it's on window, not the DOM.
        window.addEventListener(
          "error",
          function (e) {
            var p = document.body || document.documentElement;
            var d =
              document.getElementById("__bundler_err") ||
              p.appendChild(document.createElement("div"));
            d.id = "__bundler_err";
            d.style.cssText =
              "position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto";
            d.textContent =
              (d.textContent ? d.textContent + String.fromCharCode(10) : "") +
              "[bundle] " +
              (e.message || e.type) +
              (e.filename
                ? " (" + e.filename.slice(0, 60) + ":" + e.lineno + ")"
                : "");
          },
          true,
        );

        try {
          const manifestEl = document.querySelector(
            'script[type="__bundler/manifest"]',
          );
          const templateEl = document.querySelector(
            'script[type="__bundler/template"]',
          );
          if (!manifestEl || !templateEl) {
            setStatus("Error: missing bundle data");
            console.error(
              "[bundler] Missing script tags — manifestEl:",
              !!manifestEl,
              "templateEl:",
              !!templateEl,
            );
            return;
          }

          const manifest = JSON.parse(manifestEl.textContent);
          let template = JSON.parse(templateEl.textContent);

          const uuids = Object.keys(manifest);
          setStatus("Unpacking " + uuids.length + " assets...");

          const blobUrls = {};
          await Promise.all(
            uuids.map(async (uuid) => {
              const entry = manifest[uuid];
              try {
                const binaryStr = atob(entry.data);
                const bytes = new Uint8Array(binaryStr.length);
                for (let i = 0; i < binaryStr.length; i++)
                  bytes[i] = binaryStr.charCodeAt(i);

                let finalBytes = bytes;
                if (entry.compressed) {
                  if (typeof DecompressionStream !== "undefined") {
                    const ds = new DecompressionStream("gzip");
                    const writer = ds.writable.getWriter();
                    const reader = ds.readable.getReader();
                    writer.write(bytes);
                    writer.close();
                    const chunks = [];
                    let totalLen = 0;
                    while (true) {
                      const { done, value } = await reader.read();
                      if (done) break;
                      chunks.push(value);
                      totalLen += value.length;
                    }
                    finalBytes = new Uint8Array(totalLen);
                    let offset = 0;
                    for (const chunk of chunks) {
                      finalBytes.set(chunk, offset);
                      offset += chunk.length;
                    }
                  } else {
                    console.warn(
                      "DecompressionStream not available, asset " +
                        uuid +
                        " may not render",
                    );
                  }
                }

                blobUrls[uuid] = URL.createObjectURL(
                  new Blob([finalBytes], { type: entry.mime }),
                );
              } catch (err) {
                console.error("Failed to decode asset " + uuid + ":", err);
                blobUrls[uuid] = URL.createObjectURL(
                  new Blob([], { type: entry.mime }),
                );
              }
            }),
          );

          const extResEl = document.querySelector(
            'script[type="__bundler/ext_resources"]',
          );
          const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
          const resourceMap = {};
          for (const entry of extResources) {
            if (blobUrls[entry.uuid])
              resourceMap[entry.id] = blobUrls[entry.uuid];
          }

          setStatus("Rendering...");
          for (const uuid of uuids)
            template = template.split(uuid).join(blobUrls[uuid]);

          // Strip integrity + crossorigin — blob URLs from a file:// document inherit
          // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
          // The manifest bytes are ours; SRI protects against CDN compromise, not this.
          template = template
            .replace(/\s+integrity="[^"]*"/gi, "")
            .replace(/\s+crossorigin="[^"]*"/gi, "");

          const resourceScript =
            "<script>window.__resources = " +
            JSON.stringify(resourceMap)
              .split("</" + "script>")
              .join("<\\/" + "script>") +
            ";</" +
            "script>";
          // Inject after <head> so the DOCTYPE stays first; prepending the script
          // would push the parser into quirks mode. DOMParser always emits a <head>
          // (synthesizing one if the source HTML omitted it) but may carry
          // attributes through, so match the full opening tag. slice() rather than
          // replace() keeps us clear of $-pattern substitution in resourceScript.
          const headOpen = template.match(/<head[^>]*>/i);
          if (headOpen) {
            const i = headOpen.index + headOpen[0].length;
            template =
              template.slice(0, i) + resourceScript + template.slice(i);
          }

          // Parse the template and swap the root element. Scripts inserted via
          // DOMParser/replaceWith are inert per spec — re-create each with
          // createElement so they execute, awaiting onload for src scripts to
          // preserve ordering (React before ReactDOM before Babel before text/babel).
          const doc = new DOMParser().parseFromString(template, "text/html");
          document.documentElement.replaceWith(doc.documentElement);
          const dead = Array.from(document.scripts);
          for (const old of dead) {
            const s = document.createElement("script");
            for (const a of old.attributes) s.setAttribute(a.name, a.value);
            s.textContent = old.textContent;
            // text/babel scripts with a src: fetch and inline. transformScriptTags
            // does XHR against the src, but blob:null/ from a file:// origin is
            // silently dropped. Inlining makes it a plain inline babel script,
            // which transformScriptTags handles unconditionally.
            if ((s.type === "text/babel" || s.type === "text/jsx") && s.src) {
              const r = await fetch(s.src);
              s.textContent = await r.text();
              s.removeAttribute("src");
            }
            const p = s.src
              ? new Promise(function (r) {
                  s.onload = s.onerror = r;
                })
              : null;
            old.replaceWith(s);
            if (p) await p;
          }
          // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
          // which fired before we swapped the document. Trigger manually if present.
          if (
            window.Babel &&
            typeof window.Babel.transformScriptTags === "function"
          ) {
            window.Babel.transformScriptTags();
          }
        } catch (err) {
          setStatus("Error unpacking: " + err.message);
          console.error("Bundle unpack error:", err);
        }
      });
    </script>

ace {\n  font-family: 'Hanken Grotesk';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"89b686ef-3f7d-46ff-850d-205e9a84ec08\") format('woff2');\n  unicode-range: U+0102-0103, U+0110-0111, U+0128-0129, U+0168-0169, U+01A0-01A1, U+01AF-01B0, U+0300-0301, U+0303-0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'Hanken Grotesk';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"b7d83150-4bd5-4cc4-94be-318b5cefd938\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Hanken Grotesk';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"2ed8998e-9d7d-4dcc-8b8a-6575e096807c\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n<\/style>\n<style>/* ============================================================\n   Squad Delivery Dashboard — design system\n   Enterprise / technical-docs aesthetic (Vercel / Stripe feel)\n   ============================================================ */\n\n:root{\n  /* neutrals — cool, near-white surfaces */\n  --bg:#f6f7f9;\n  --surface:#ffffff;\n  --surface-2:#f3f5f8;\n  --surface-3:#eaeef3;\n  --border:#e4e8ee;\n  --border-strong:#d3dae3;\n  --ink:#13171d;\n  --ink-2:#2c333d;\n  --muted:#5b6675;\n  --faint:#8a94a3;\n\n  /* single restrained accent — technical blue */\n  --accent:#2563eb;\n  --accent-ink:#1d4ed8;\n  --accent-wash:#eef3ff;\n  --accent-wash-2:#e3ecfe;\n  --ring:rgba(37,99,235,.32);\n\n  /* status families (solid tint bg + dark legible text) */\n  --ok:#15803d;     --ok-bg:#e8f6ed;   --ok-bd:#bbe3c8;\n  --warn:#a4570a;   --warn-bg:#fcf1df;  --warn-bd:#f1d4a0;\n  --err:#c62828;    --err-bg:#fcebec;   --err-bd:#f2c1c4;\n  --info:#1763c6;   --info-bg:#e9f2fd;  --info-bd:#bdd8f6;\n  --violet:#6d28d9; --violet-bg:#f1ecfe; --violet-bd:#d8c9fb;\n  --teal:#0f766e;   --teal-bg:#e2f6f3;  --teal-bd:#aee3da;\n  --indigo:#4338ca; --indigo-bg:#ebedfd; --indigo-bd:#c6ccf7;\n  --slate:#445268;  --slate-bg:#eef1f5; --slate-bd:#d3dae2;\n\n  /* model tiers */\n  --t1:#3b5bdb; --t1-bg:#e8ecfb; --t1-bd:#c2cdf4;\n  --t2:#0284c7; --t2-bg:#e1f3fb; --t2-bd:#aadcf1;\n  --t3:#0d9488; --t3-bg:#e0f5f2; --t3-bd:#a6e0d8;\n\n  /* severity dots */\n  --sev-high:#dc2626; --sev-med:#d97706; --sev-low:#64748b;\n\n  /* terminal states */\n  --done:#15803d; --ship:#a4570a; --fail:#c62828;\n\n  /* code */\n  --code-bg:#eef1f6; --code-fg:#1f4c87;\n\n  --shadow-sm:0 1px 2px rgba(16,24,40,.05);\n  --shadow:0 1px 3px rgba(16,24,40,.07), 0 1px 2px rgba(16,24,40,.04);\n  --shadow-lg:0 12px 32px -12px rgba(16,24,40,.28);\n  --radius:12px;\n  --radius-sm:8px;\n\n  --sidebar-w:248px;\n  --topbar-h:62px;\n\n  --font:'Geist','Hanken Grotesk',system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;\n  --mono:'Geist Mono','JetBrains Mono',ui-monospace,'SF Mono',Menlo,Consolas,monospace;\n}\n\n:root[data-theme=\"dark\"]{\n  --bg:#0c0f15;\n  --surface:#13171f;\n  --surface-2:#171c26;\n  --surface-3:#1d2430;\n  --border:#252c38;\n  --border-strong:#323b49;\n  --ink:#eef2f8;\n  --ink-2:#cfd6e1;\n  --muted:#9aa6b6;\n  --faint:#697485;\n\n  --accent:#5b8cff;\n  --accent-ink:#85a9ff;\n  --accent-wash:#152138;\n  --accent-wash-2:#1a294a;\n  --ring:rgba(91,140,255,.36);\n\n  --ok:#5ed18a;     --ok-bg:#0f2a1b;   --ok-bd:#1d4d33;\n  --warn:#e6b15e;   --warn-bg:#2c2110;  --warn-bd:#553f1b;\n  --err:#f08a8f;    --err-bg:#2c1416;   --err-bd:#5a262a;\n  --info:#74b1f5;   --info-bg:#10233c;  --info-bd:#234a73;\n  --violet:#bd9cfb; --violet-bg:#211633; --violet-bd:#43326a;\n  --teal:#5fd6c6;   --teal-bg:#0c2b27;  --teal-bd:#1c5249;\n  --indigo:#9aa6fb; --indigo-bg:#1a1d3a; --indigo-bd:#343a6e;\n  --slate:#9fadc2;  --slate-bg:#1a212c; --slate-bd:#333d4c;\n\n  --t1:#8098f0; --t1-bg:#161d3a; --t1-bd:#2c3a73;\n  --t2:#52b4e8; --t2-bg:#0c2536; --t2-bd:#1d4a68;\n  --t3:#52c4b6; --t3-bg:#0b2b27; --t3-bd:#1b5249;\n\n  --sev-high:#f0726f; --sev-med:#e3a44e; --sev-low:#8b97a8;\n  --done:#5ed18a; --ship:#e6b15e; --fail:#f08a8f;\n\n  --code-bg:#171f2c; --code-fg:#9dc1f0;\n\n  --shadow-sm:0 1px 2px rgba(0,0,0,.4);\n  --shadow:0 1px 3px rgba(0,0,0,.5);\n  --shadow-lg:0 16px 40px -14px rgba(0,0,0,.7);\n}\n\n*{box-sizing:border-box}\nhtml{scroll-behavior:smooth}\nbody{\n  margin:0;\n  background:var(--bg);\n  color:var(--ink);\n  font-family:var(--font);\n  font-size:15px;\n  line-height:1.55;\n  -webkit-font-smoothing:antialiased;\n  text-rendering:optimizeLegibility;\n}\ncode,.mono{font-family:var(--mono)}\n::selection{background:var(--accent-wash-2)}\n\n/* scroll padding so anchors clear the sticky topbar */\n:target{scroll-margin-top:calc(var(--topbar-h) + 20px)}\n.section{scroll-margin-top:calc(var(--topbar-h) + 20px)}\n\n/* ============ LAYOUT ============ */\n.app{display:grid;grid-template-columns:var(--sidebar-w) 1fr;min-height:100vh}\n\n/* ---- Sidebar ---- */\n.sidebar{\n  position:sticky;top:0;align-self:start;height:100vh;\n  background:var(--surface);\n  border-right:1px solid var(--border);\n  display:flex;flex-direction:column;\n  overflow:hidden;\n}\n.brand{\n  display:flex;align-items:center;gap:11px;\n  padding:18px 20px 16px;\n  border-bottom:1px solid var(--border);\n}\n.brand .mark{\n  width:32px;height:32px;border-radius:9px;flex:0 0 auto;\n  background:linear-gradient(140deg,var(--accent),#7aa2ff);\n  display:grid;place-items:center;color:#fff;font-weight:700;font-size:15px;\n  box-shadow:inset 0 1px 0 rgba(255,255,255,.3);\n}\n.brand .bt{font-weight:600;font-size:14px;letter-spacing:-.1px;line-height:1.2}\n.brand .bs{font-size:11.5px;color:var(--muted);letter-spacing:.2px}\n\n.nav{flex:1;overflow-y:auto;padding:14px 12px 24px}\n.nav::-webkit-scrollbar{width:8px}\n.nav::-webkit-scrollbar-thumb{background:var(--border-strong);border-radius:8px}\n.nav .group{margin:0 0 4px}\n.nav .glabel{\n  font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.9px;\n  color:var(--faint);padding:14px 12px 6px;\n}\n.nav .group:first-child .glabel{padding-top:4px}\n.nav a{\n  display:flex;align-items:center;gap:9px;\n  padding:7px 12px;margin:1px 0;border-radius:8px;\n  color:var(--muted);text-decoration:none;font-size:13.5px;font-weight:500;\n  transition:background .12s,color .12s;\n  position:relative;\n}\n.nav a .ni{\n  width:6px;height:6px;border-radius:50%;background:var(--border-strong);flex:0 0 auto;\n  transition:background .12s,transform .12s;\n}\n.nav a:hover{background:var(--surface-2);color:var(--ink-2)}\n.nav a.active{background:var(--accent-wash);color:var(--accent-ink);font-weight:600}\n.nav a.active .ni{background:var(--accent);transform:scale(1.25)}\n\n.sidefoot{\n  padding:12px 18px;border-top:1px solid var(--border);\n  font-size:11px;color:var(--faint);line-height:1.5;\n}\n.sidefoot b{color:var(--muted);font-weight:600}\n\n/* ---- Main column ---- */\n.main{min-width:0;display:flex;flex-direction:column}\n\n.topbar{\n  position:sticky;top:0;z-index:40;height:var(--topbar-h);\n  display:flex;align-items:center;gap:16px;\n  padding:0 30px;\n  background:color-mix(in srgb,var(--surface) 86%,transparent);\n  backdrop-filter:saturate(140%) blur(10px);\n  -webkit-backdrop-filter:saturate(140%) blur(10px);\n  border-bottom:1px solid var(--border);\n}\n.topbar .tt{font-weight:600;font-size:15px;letter-spacing:-.1px;white-space:nowrap}\n.topbar .tt .path{color:var(--muted);font-weight:500}\n.topbar .spacer{flex:1}\n.statuspill{\n  display:inline-flex;align-items:center;gap:7px;\n  padding:5px 12px;border-radius:999px;font-size:12.5px;font-weight:600;\n  background:var(--warn-bg);color:var(--warn);border:1px solid var(-- und code,.lede code,.note code,.foot code,td code,.verdict code,.srcbar code,.kv code{\n  font-family:var(--mono);font-size:.86em;background:var(--code-bg);color:var(--code-fg);\n  padding:1.5px 5px;border-radius:5px;white-space:normal;overflow-wrap:anywhere;\n}\n.ground b{color:var(--ink-2)}\n\n/* ============ SECTIONS ============ */\n.section{margin:46px 0 0;padding-top:6px}\n.section:first-of-type{margin-top:0}\n.shead{display:flex;align-items:flex-end;gap:14px;margin:0 0 4px}\n.shead .num{\n  font-family:var(--mono);font-size:12px;font-weight:600;color:var(--accent);\n  background:var(--accent-wash);border:1px solid var(--accent-wash-2);\n  padding:2px 8px;border-radius:6px;\n}\n.shead h2{\n  font-size:20px;font-weight:700;letter-spacing:-.3px;margin:0;color:var(--ink);\n}\n.ssub{color:var(--muted);font-size:13.5px;margin:6px 0 18px;max-width:960px;line-height:1.6}\n.ssub b{color:var(--ink-2)}\n\n.grouphead{\n  font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:1.1px;\n  color:var(--faint);margin:40px 0 16px;display:flex;align-items:center;gap:12px;\n}\n.grouphead::after{content:\"\";flex:1;height:1px;background:var(--border)}\n\n/* ============ NOTE / CALLOUT ============ */\n.note{\n  background:var(--surface);border:1px solid var(--border);border-left:3px solid var(--accent);\n  border-radius:var(--radius-sm);padding:13px 16px;margin:0 0 16px;\n  font-size:13px;line-height:1.6;color:var(--muted);box-shadow:var(--shadow-sm);\n}\n.note.tight{margin-bottom:12px}\n.note b{color:var(--ink-2)}\n.note i{color:var(--ink-2)}\n.statline{\n  display:flex;flex-wrap:wrap;gap:8px 22px;align-items:center;\n  background:var(--surface-2);border:1px solid var(--border);border-radius:var(--radius-sm);\n  padding:11px 16px;margin:0 0 16px;font-size:13.5px;color:var(--ink-2);\n}\n.statline b{color:var(--accent-ink);font-weight:700}\n.statline .sep{color:var(--border-strong)}\n\n/* ============ LEGEND ============ */\n.legend{\n  display:grid;grid-template-columns:repeat(auto-fill,minmax(228px,1fr));gap:2px;\n  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);\n  overflow:hidden;box-shadow:var(--shadow-sm);margin:0;\n}\n.legend .grp{padding:14px 16px;background:var(--surface);border:1px solid var(--border);margin:-1px 0 0 -1px}\n.legend h4{\n  margin:0 0 9px;font-size:11px;text-transform:uppercase;letter-spacing:.8px;\n  color:var(--faint);font-weight:700;\n}\n.legend .row{display:flex;gap:6px;flex-wrap:wrap}\n\n/* ============ BADGES ============ */\n.badge{\n  display:inline-flex;align-items:center;gap:5px;\n  font-size:12px;font-weight:600;line-height:1.35;\n  padding:2.5px 8px;border-radius:6px;border:1px solid transparent;white-space:nowrap;\n  letter-spacing:.1px;\n}\n.badge.lg{font-size:12.5px;padding:3px 9px}\n.chip{\n  display:inline-flex;align-items:center;gap:6px;\n  font-size:12.5px;padding:3px 9px;border-radius:999px;\n  border:1px solid var(--border-strong);background:var(--surface);color:var(--ink-2);white-space:nowrap;\n}\n.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:0 0 auto}\n\n.b-auto{color:var(--ok);background:var(--ok-bg);border-color:var(--ok-bd)}\n.b-async{color:var(--info);background:var(--info-bg);border-color:var(--info-bd)}\n.b-sync{color:var(--err);background:var(--err-bg);border-color:var(--err-bd)}\n.b-gate{color:var(--violet);background:var(--violet-bg);border-color:var(--violet-bd)}\n.b-json{color:var(--teal);background:var(--teal-bg);border-color:var(--teal-bd)}\n.b-jsonm{color:var(--teal);background:transparent;border-color:var(--teal-bd)}\n.b-verify{color:var(--indigo);background:var(--indigo-bg);border-color:var(--indigo-bd)}\n.b-doc{color:var(--slate);background:var(--slate-bg);border-color:var(--slate-bd)}\n.b-gap{color:var(--warn);background:var(--warn-bg);border-color:var(--warn-bd)}\n.b-wired{color:var(--ok);background:var(--ok-bg);border-color:var(--ok-bd)}\n.b-partial{color:var(--info);background:var(--info-bg);border-color:var(--info-bd)}\n.b-absent{color:var(--err);background:var(--err-bg);border-color:var(--err-bd)}\n.b-emit{color:var(--accent-ink);background:transparent;border-color:var(--accent);border-style:dashed}\n\n.b-tier{color:#fff;border:none;font-weight:700}\n.tier-T1{background:var(--t1)} .tier-T2{background:var(--t2)} .tier-T3{background:var(--t3)}\n.tierchip-T1{color:var(--t1);background:var(--t1-bg);border-color:var(--t1-bd)}\n.tierchip-T2{color:var(--t2);background:var(--t2-bg);border-color:var(--t2-bd)}\n.tierchip-T3{color:var(--t3);background:var(--t3-bg);border-color:var(--t3-bd)}\n\n/* ============ HIGHLIGHTER BAR ============ */\n.hlbar{display:flex;gap:9px;flex-wrap:wrap;align-items:center;margin:0 0 18px}\n.hlbar .lbl{font-size:12.5px;color:var(--muted);font-weight:600}\n.hlchip{\n  cursor:pointer;font-size:12px;font-weight:600;padding:4px 11px;border-radius:999px;\n  border:1px solid var(--teal-bd);color:var(--teal);background:var(--teal-bg);\n  font-family:var(--mono);transition:.13s;\n}\n.hlchip:hover{border-color:var(--accent);color:var(--accent)}\n.hlchip.on{background:var(--accent);color:#fff;border-color:var(--accent)}\n.card.hl,tr.hl{outline:2px solid var(--accent);outline-offset:-2px}\n.card.hl{box-shadow:0 0 0 3px var(--ring),var(--shadow-lg)}\ntr.hl td{background:var(--accent-wash)}\n.dim{opacity:.32;transition:opacity .15s}\n\n/* ============ PIPELINE FLOW ============ */\n.flow{\n  display:flex;align-items:stretch;gap:0;overflow-x:auto;\n  padding:6px 2px 18px;scroll-snap-type:x proximity;\n}\n.flow::-webkit-scrollbar{height:9px}\n.flow::-webkit-scrollbar-thumb{background:var(--border-strong);border-radius:8px}\n.stage{min-width:264px;max-width:264px;display:flex;flex-direction:column;scroll-snap-align:start}\n.flowarrow{align-self:center;color:var(--faint);font-size:20px;padding:0 8px;flex:0 0 auto;user-select:none}\n.card{\n  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);\n  padding:14px 15px;cursor:pointer;transition:border-color .14s,transform .14s,box-shadow .14s;\n  height:100%;position:relative;box-shadow:var(--shadow-sm);\n}\n.card:hover{border-color:var(--accent);transform:translateY(-2px);box-shadow:var(--shadow-lg)}\n.card.deferred{\n  border-style:dashed;\n  background:\n    repeating-linear-gradient(135deg,transparent,transparent 11px,var(--surface-2) 11px,var(--surface-2) 22px),\n    var(--surface);\n}\n.card .crow{display:flex;align-items:center;justify-content:space-between;gap:8px}\n.card .sid{\n  font-family:var(--mono);font-size:12px;font-weight:600;color:var(--accent);\n  background:var(--accent-wash);padding:1.5px 7px;border-radius:5px;letter-spacing:.3px;\n}\n.card .nm{font-weight:700;font-size:16.5px;margin:9px 0 10px;letter-spacing:-.2px;line-height:1.2}\n.kv{display:flex;flex-direction:column;gap:5px;font-size:12.5px;color:var(--muted)}\n.kv .k{color:var(--faint);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.4px}\n.kv .v{color:var(--ink-2)}\n.kv .pair{display:flex;flex-direction:column;gap:1px}\n.badges{display:flex;gap:5px;flex-wrap:wrap;margin-top:11px}\n.caret{color:var(--faint);font-size:11px;transition:transform .2s;line-height:1}\n.card.open .caret{transform:rotate(180deg)}\n.expand{display:none;margin-top:12px;border-top:1px dashed var(--border-strong);padding-top:11px}\n.expand.open{display:block}\n.expand .erow{margin-top:9px}\n.expand .erow:first-child{margin-top:0}\n.expand .el{\n  color:var(--faint);font-weight:700;text-transform:uppercase;font-size:10px;letter-spacing:.6px;\n  display:block;margin-bottom:2px;\n}\n.expand .ev{font-size:12.5px;color:var(--ink-2);line-height:1.5}\n\n/* ============ TABLES ============ */\n.tablewrap{\n  overflow-x:auto;border:1px solid var(--border);border-radius:var(--radius);\n  box-shadow:var(--shadow-sm);margin:0 0 8px;background:var(--surface);\n}\n.tablewrap::-webkit-scrollbar{height:9px}\n.tablewrap::-webkit-scrollbar-thumb{background:var(--border-strong);border-radius:8px}\ntable.dtable{width:100%;border-collapse:separate;border-spacing:0;font-size:13.5px;background:var(--surface)}\ntable.dtable thead th{\n  position:sticky;top:0;z-index:2;\n  background:var(--surface-2);color:var(--muted);text-align:left;\n  font-size:11px;text-transform:uppercase;letter-spacing:.6px;font-weight:700;\n  padding:11px 14px;border-bottom:1px solid var(--border-strong);white-space:nowrap;\n}\ntable.dtable td{\n  padding:11px 14px;border-bottom:1px solid var(--border);color:var(--ink-2);\n  vertical-align:top;line-height:1.5;\n}\ntable.dtable tbody tr:last-child td{border-bottom:none}\ntable.dtable tbody tr{transition:background .1s}\ntable.dtable tbody tr:hover{background:var(--surface-2)}\ntable.dtable tr.deferred td:first-child{box-shadow:inset 3px 0 0 var(--warn-bd)}\ntable.dtable .sid{font-family:var(--mono);font-weight:600;color:var(--accent);font-size:12.5px}\ntable.dtable .stagename{font-weight:600;color:var(--ink)}\ntable.dtable .num{font-family:var(--mono);color:var(--faint);font-size:12px}\n.t-muted{color:var(--muted);font-size:12.5px}\n.t-mw{max-width:300px}\n.dash{color:var(--faint)}\n\n/* sticky-header tables get a capped height so the header actually sticks */\n.tablewrap.scrolly{max-height:560px;overflow-y:auto}\n\n/* ============ ACCORDION ============ */\n.acc{\n  border:1px solid var(--border);border-radius:var(--radius);background:var(--surface);\n  margin:0 0 8px;box-shadow:var(--shadow-sm);overflow:hidden;\n}\n.acc summary{\n  list-style:none;cursor:pointer;padding:14px 18px;display:flex;align-items:center;gap:12px;\n  font-weight:600;font-size:14.5px;color:var(--ink);user-select:none;\n}\n.acc summary::-webkit-details-marker{display:none}\n.acc summary:hover{background:var(--surface-2)}\n.acc summary .chev{\n  margin-left:auto;color:var(--faint);transition:transform .2s;font-size:13px;\n}\n.acc[open] summary .chev{transform:rotate(90deg)}\n.acc summary .scount{\n  font-size:11.5px;color:var(--muted);font-weight:600;font-family:var(--mono);\n  background:var(--surface-2);border:1px solid var(--border);padding:2px 8px;border-radius:999px;\n}\n.acc .accbody{padding:0 18px 18px;border-top:1px solid var(--border)}\n.acc .accbody.flush{padding:0}\n.acc .accbody.flush .tablewrap{border:none;border-radius:0;box-shadow:none;margin:0}\n.acc .accbody.flush .tablewrap table.dtable thead th{border-top:1px solid var(--border)}\n\n/* ============ DIAGRAMS (fan-out / bus / outputs) ============ */\n.diagram{\n  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);\n  padding:20px;box-shadow:var(--shadow-sm);\n}\n.stepline{display:flex;align-items:center;gap:12px;flex-wrap:wrap}\n.stepline + .stepline{margin-top:10px}\n.node{\n  background:var(--surface-2);border:1px solid var(--border-strong);border-radius:10px;\n  padding:10px 13px;font-size:13.5px;font-weight:600;text-align:center;color:var(--ink-2);\n  min-width:0;\n}\n.node small{display:block;color:var(--muted);font-weight:500;font-size:11px;margin-top:3px;line-height:1.4}\n.node small code{font-size:10.5px}\n.node.orch{border-color:var(--accent);background:var(--accent-wash);color:var(--accent-ink)}\n.node.gate{border-color:var(--err-bd);background:var(--err-bg);color:var(--err)}\n.node.barrier{border-color:var(--warn-bd);background:var(--warn-bg);color:var(--warn)}\n.par{display:flex;gap:8px;flex-wrap:wrap}\n.ar{color:var(--faint);font-weight:700;font-size:16px;flex:0 0 auto}\n.lane{\n  display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin:12px 0;padding:11px 13px;\n  border:1px dashed var(--border-strong);border-radius:10px;background:var(--surface-2);\n}\n.lane .tag{\n  font-size:10.5px;color:var(--faint);font-weight:700;letter-spacing:.5px;\n  text-transform:uppercase;flex:0 0 auto;\n}\n.lane.why{font-size:13px;color:var(--muted);line-height:1.55}\n.lane.why .tag{align-self:flex-start;margin-top:2px}\n.cap{\n  font-size:11px;color:var(--warn);font-weight:600;background:var(--warn-bg);\n  border:1px solid var(--warn-bd);border-radius:6px;padding:1px 6px;font-family:var(--mono);\n}\n\n/* event bus */\n.bus{display:flex;flex-direction:column;gap:8px}\n.busrow{\n  display:flex;align-items:center;gap:12px;flex-wrap:wrap;\n  background:var(--surface);border:1px solid var(--border);border-radius:10px;\n  padding:11px 14px;box-shadow:var(--shadow-sm);transition:border-color .12s;\n}\n.busrow:hover{border-color:var(--border-strong)}\n.busrow.collapse{border-left:3px solid var(--accent)}\n.busrow .topic{font-family:var(--mono);font-size:12.5px;font-weight:600;color:var(--accent);min-width:166px}\n.busrow .prod{font-size:12px;color:var(--muted);min-width:128px}\n.busrow .subs{display:flex;gap:6px;flex-wrap:wrap;flex:1}\n.pill{\n  font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:6px;\n  background:var(--surface-2);border:1px solid var(--border);color:var(--ink-2);\n}\n.collapseflag{\n  font-size:11px;font-weight:700;color:var(--accent);margin-left:auto;white-space:nowrap;\n  font-family:var(--mono);\n}\n\n/* ============ TERMINAL STATES ============ */\n.terms{display:grid;grid-template-columns:repeat(auto-fit,minmax(244px,1fr));gap:14px}\n.term{\n  border:1px solid var(--border);border-radius:var(--radius);padding:16px 18px;\n  background:var(--surface);box-shadow:var(--shadow-sm);position:relative;overflow:hidden;\n}\n.term::before{content:\"\";position:absolute;left:0;top:0;bottom:0;width:4px}\n.term .t{font-weight:700;font-size:15.5px;display:flex;align-items:center;gap:9px;letter-spacing:-.1px}\n.term p{margin:9px 0 0;font-size:13px;color:var(--muted);line-height:1.55}\n.term p b{color:var(--ink-2)}\n.term.done::before{background:var(--done)} .term.done .t{color:var(--done)}\n.term.ship::before{background:var(--ship)} .term.ship .t{color:var(--ship)}\n.term.fail::before{background:var(--fail)} .term.fail .t{color:var(--fail)}\n.term.hard::before{background:var(--fail)} .term.hard .t{color:var(--fail)}\n\n/* ============ VERDICT ============ */\n.verdict{\n  background:var(--surface);border:1px solid var(--warn-bd);border-radius:var(--radius);\n  padding:20px 22px;box-shadow:var(--shadow-sm);position:relative;overflow:hidden;\n}\n.verdict::before{content:\"\";position:absolute;left:0;top:0;right:0;height:3px;background:var(--warn)}\n.verdict h3{\n  margin:4px 0 14px;color:var(--warn);font-size:16px;font-weight:700;\n  display:flex;align-items:center;gap:9px;\n}\n.verdict ol{margin:0;padding-left:0;list-style:none;counter-reset:v;display:flex;flex-direction:column;gap:11px}\n.verdict ol li{\n  counter-increment:v;position:relative;padding-left:38px;font-size:14px;color:var(--ink-2);line-height:1.55;\n}\n.verdict ol li::before{\n  content:counter(v);position:absolute;left:0;top:0;\n  width:24px;height:24px;border-radius:7px;display:grid;place-items:center;\n  background:var(--warn-bg);color:var(--warn);border:1px solid var(--warn-bd);\n  font-size:12px;font-weight:700;font-family:var(--mono);\n}\n.verdict ol li b{color:var(--ink)}\n\n/* ============ RUNTIME / FOOT / SRCBAR ============ */\n.cmdcard{\n  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);\n  padding:16px 18px;margin:0 0 14px;box-shadow:var(--shadow-sm);font-size:13.5px;\n  line-height:1.65;color:var(--muted);\n}\n.cmdcard b{color:var(--ink-2)}\n.srcbar{font-size:12px;color:var(--muted);line-height:1.85;margin-top:14px}\n.srcbar b{color:var(--ink-2)}\n.foot{\n  margin-top:46px;color:var(--muted);font-size:13px;border-top:1px solid var(--border);\n  padding-top:18px;line-height:1.6;\n}\n.foot b{color:var(--ink-2)}\n\n/* ============ TOOLTIP ============ */\n#tip{\n  position:fixed;z-index:99;pointer-events:none;max-width:360px;\n  background:var(--surface);color:var(--ink-2);border:1px solid var(--border-strong);\n  border-radius:10px;padding:11px 13px;font-size:12.5px;line-height:1.5;\n  box-shadow:var(--shadow-lg);display:none;\n}\n#tip .th{font-weight:700;color:var(--ink);margin-bottom:4px;font-size:13px}\n#tip b{color:var(--accent-ink);font-weight:600}\n\n/* ============ RESPONSIVE ============ */\n@media (max-width:1080px){\n  .app{grid-template-columns:1fr}\n  .sidebar{display:none}\n  .mobnav{\n    display:flex;gap:7px;overflow-x:auto;position:sticky;top:var(--topbar-h);z-index:39;\n    background:color-mix(in srgb,var(--surface) 92%,transparent);\n    backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);\n    border-bottom:1px solid var(--border);padding:10px 16px;\n  }\n  .mobnav a{\n    flex:0 0 auto;font-size:12.5px;font-weight:600;color:var(--muted);text-decoration:none;\n    padding:6px 12px;border-radius:999px;border:1px solid var(--border);background:var(--surface);white-space:nowrap;\n  }\n  .mobnav a.active{color:var(--accent-ink);background:var(--accent-wash);border-color:var(--accent)}\n  .content{padding:24px 20px 80px}\n  .topbar{padding:0 18px}\n  .topbar .tt .path{display:none}\n}\n@media (max-width:680px){\n  .hero h1{font-size:24px}\n  .lede{font-size:14.5px}\n  .content{padding:20px 14px 70px}\n  .ctl .ctltext{display:none}\n  .statuspill{display:none}\n  .shead h2{font-size:17px}\n}\n<\/style>\n<\/head>\n<body>\n<div class=\"app\">\n\n  <!-- ============ SIDEBAR ============ -->\n  <aside class=\"sidebar\">\n    <div class=\"brand\">\n      <div class=\"mark\">SD<\/div>\n      <div>\n        <div class=\"bt\">Squad Delivery<\/div>\n        <div class=\"bs\">Requirement → Production<\/div>\n      <\/div>\n    <\/div>\n    <nav class=\"nav\" id=\"nav\">\n      <div class=\"group\">\n        <div class=\"glabel\">Overview<\/div>\n        <a href=\"#overview\"><span class=\"ni\"><\/span>Header &amp; status<\/a>\n        <a href=\"#pipeline\"><span class=\"ni\"><\/span>Pipeline flow · S0→S7<\/a>\n      <\/div>\n      <div class=\"group\">\n        <div class=\"glabel\">Core data<\/div>\n        <a href=\"#summary\"><span class=\"ni\"><\/span>Step summary<\/a>\n        <a href=\"#io\"><span class=\"ni\"><\/span>Stage I/O<\/a>\n        <a href=\"#outputs\"><span class=\"ni\"><\/span>Stage outputs<\/a>\n      <\/div>\n      <div class=\"group\">\n        <div class=\"glabel\">Architecture &amp; events<\/div>\n        <a href=\"#bus\"><span class=\"ni\"><\/span>Event bus<\/a>\n        <a href=\"#fanout\"><span class=\"ni\"><\/span>Inside S4 · fan-out<\/a>\n        <a href=\"#sdlc\"><span class=\"ni\"><\/span>SDLC mapping<\/a>\n      <\/div>\n      <div class=\"group\">\n        <div class=\"glabel\">Governance &amp; policy<\/div>\n        <a href=\"#gates\"><span class=\"ni\"><\/span>Human approval gates<\/a>\n        <a href=\"#safety\"><span class=\"ni\"><\/span>Command-safety policy<\/a>\n      <\/div>\n      <div class=\"group\">\n        <div class=\"glabel\">Metrics &amp; tooling<\/div>\n        <a href=\"#models\"><span class=\"ni\"><\/span>Model selection<\/a>\n        <a href=\"#quality\"><span class=\"ni\"><\/span>Quality gates matrix<\/a>\n        <a href=\"#skills\"><span class=\"ni\"><\/span>Skill coverage<\/a>\n      <\/div>\n      <div class=\"group\">\n        <div class=\"glabel\">Conclusion<\/div>\n        <a href=\"#terminal\"><span class=\"ni\"><\/span>Terminal states<\/a>\n        <a href=\"#runtime\"><span class=\"ni\"><\/span>Runtime · validation<\/a>\n        <a href=\"#verdict\"><span class=\"ni\"><\/span>Verdict<\/a>\n      <\/div>\n    <\/nav>\n    <div class=\"sidefoot\">\n      <b>L3 assisted-autonomous<\/b><br>\n      HOTL within a phase · HITL at every irreversible boundary. Generated 2026-05-31 · updated 2026-06-01.\n    <\/div>\n  <\/aside>\n\n  <!-- ============ MAIN ============ -->\n  <div class=\"main\">\n    <header class=\"topbar\">\n      <div class=\"tt\">Squad Delivery <span class=\"path\">— Raw Requirement → Production Application<\/span><\/div>\n      <div class=\"spacer\"><\/div>\n      <span class=\"statuspill\"><span class=\"dot\"><\/span>Conditional — design ready<\/span>\n      <button class=\"ctl\" id=\"toggleDeferred\" aria-pressed=\"true\" title=\"Show / hide deferred (GAP) stages\">\n        ⚠ <span class=\"ctltext\"><span class=\"dt-label\">Deferred (GAP)<\/span><\/span>\n      <\/button>\n      <button class=\"ctl\" id=\"expandAll\" aria-pressed=\"false\" title=\"Expand / collapse all stage cards\">\n        ⤢ <span class=\"ctltext\"><span class=\"ea-label\">Expand all<\/span><\/span>\n      <\/button>\n      <button class=\"ctl iconbtn\" id=\"themeToggle\" title=\"Toggle theme\"><span class=\"theme-label\">☾ Dark<\/span><\/button>\n    <\/header>\n\n    <!-- mobile chip nav -->\n    <nav class=\"mobnav\">\n      <a href=\"#overview\" class=\"active\">Overview<\/a>\n      <a href=\"#pipeline\">Pipeline<\/a>\n      <a href=\"#summary\">Summary<\/a>\n      <a href=\"#io\">I/O<\/a>\n      <a href=\"#outputs\">Outputs<\/a>\n      <a href=\"#bus\">Event bus<\/a>\n      <a href=\"#fanout\">S4 fan-out<\/a>\n      <a href=\"#sdlc\">SDLC<\/a>\n      <a href=\"#gates\">Gates<\/a>\n      <a href=\"#safety\">Safety<\/a>\n      <a href=\"#models\">Models<\/a>\n      <a href=\"#quality\">Quality<\/a>\n      <a href=\"#skills\">Skills<\/a>\n      <a href=\"#terminal\">Terminal<\/a>\n      <a href=\"#runtime\">Runtime<\/a>\n      <a href=\"#verdict\">Verdict<\/a>\n    <\/nav>\n\n    <main class=\"content\">\n\n      <!-- ===== OVERVIEW ===== -->\n      <section class=\"section\" id=\"overview\">\n        <div class=\"hero\">\n          <div class=\"eyebrow\"><span class=\"num\">00<\/span>Agentic workflow design · supervision view<\/div>\n          <h1>Squad Delivery — <span class=\"accent\">Raw Requirement → Production<\/span><\/h1>\n          <p class=\"lede\">The squad <b>recommends and produces artifacts<\/b>; a <b>named human is the accountable owner of record<\/b> and approves every irreversible step. Click any stage to expand caps / schema / failure policy. Hover a stage card for detail.<\/p>\n        <\/div>\n\n        <div class=\"metarow\">\n          <div class=\"metacard\"><div class=\"mk\">Stages<\/div><div class=\"mv\">14<\/div><div class=\"mn\">S0 → S7 incl. sub-stages<\/div><\/div>\n          <div class=\"metacard\"><div class=\"mk\">Human gates<\/div><div class=\"mv\">11<span style=\"color:var(--faint);font-size:14px\">/14<\/span><\/div><div class=\"mn\">named owner of record<\/div><\/div>\n          <div class=\"metacard\"><div class=\"mk\">Autonomy<\/div><div class=\"mv sm\">L3 assisted<\/div><div class=\"mn\">HOTL in-phase · HITL at boundaries<\/div><\/div>\n          <div class=\"metacard\"><div class=\"mk\">Skill coverage<\/div><div class=\"mv\">13<span style=\"color:var(--faint);font-size:14px\">/26<\/span><\/div><div class=\"mn\">✦ 14 live in workflows/skills/ · 2 unbuilt (OI-002)<\/div><\/div>\n          <div class=\"metacard\"><div class=\"mk\">Verdict<\/div><div class=\"mv sm\" style=\"color:var(--warn)\">Conditional<\/div><div class=\"mn\">design ready · gaps to close<\/div><\/div>\n        <\/div>\n\n        <p class=\"ground\"><b>Updated 2026-06-01:<\/b> pipeline relocated to <code>workflows/<\/code> (<code>workflows/delivery-pipeline.yaml<\/code> + <code>workflows/schemas/<\/code>); <code>agentic-delivery-pipeline/<\/code> archived; S1 BA-research composite wired live; Rust <code>squad-engine<\/code> archived → validation now static. Grounded in <code>workflows/delivery-pipeline.yaml<\/code> · <code>DELIVERY_WORKFLOW_PLAN.md<\/code> v2.3 (archived) · the squad-flow v0.7 ShopPilot dry-run (archived). <b>Self-contained — works fully offline, no network calls.<\/b><\/p>\n\n        <div class=\"grouphead\">Unified badge legend<\/div>\n        <div class=\"legend\">\n          <div class=\"grp\">\n            <h4>Approval gate<\/h4>\n            <div class=\"row\">\n              <span class=\"badge b-auto\">⚙ AUTO<\/span>\n              <span class=\"badge b-async\">⏸ async review<\/span>\n              <span class=\"badge b-sync\">🔒 sync named<\/span>\n              <span class=\"badge b-gate\">◆ decision gate<\/span>\n            <\/div>\n          <\/div>\n          <div class=\"grp\">\n            <h4>Finding severity<\/h4>\n            <div class=\"row\">\n              <span class=\"chip\"><span class=\"dot\" style=\"background:var(--sev-high)\"><\/span>high · blocking<\/span>\n              <span class=\"chip\"><span class=\"dot\" style=\"background:var(--sev-med)\"><\/span>medium<\/span>\n              <span class=\"chip\"><span class=\"dot\" style=\"background:var(--sev-low)\"><\/span>low · advisory<\/span>\n            <\/div>\n          <\/div>\n          <div class=\"grp\">\n            <h4>Model tier<\/h4>\n            <div class=\"row\">\n              <span class=\"chip tierchip-T1\"><span class=\"dot\" style=\"background:var(--t1)\"><\/span>T1 Banking · Opus 4.8<\/span>\n              <span class=\"chip tierchip-T2\"><span class=\"dot\" style=\"background:var(--t2)\"><\/span>T2 Prod · hybrid<\/span>\n              <span class=\"chip tierchip-T3\"><span class=\"dot\" style=\"background:var(--t3)\"><\/span>T3 Research · Gemini<\/span>\n            <\/div>\n          <\/div>\n          <div class=\"grp\">\n            <h4>Terminal state<\/h4>\n            <div class=\"row\">\n              <span class=\"chip\"><span class=\"dot\" style=\"background:var(--done)\"><\/span>Done<\/span>\n              <span class=\"chip\"><span class=\"dot\" style=\"background:var(--ship)\"><\/span>ShipWithCaveats<\/span>\n              <span class=\"chip\"><span class=\"dot\" style=\"background:var(--fail)\"><\/span>Failed / HardFail<\/span>\n            <\/div>\n          <\/div>\n          <div class=\"grp\">\n            <h4>Handoff &amp; human review<\/h4>\n            <div class=\"row\">\n              <span class=\"badge b-json\">{} JSON contract<\/span>\n              <span class=\"badge b-jsonm\">{} JSON + code<\/span>\n              <span class=\"badge b-verify\">✋ human verify<\/span>\n              <span class=\"badge b-doc\">📄 review doc<\/span>\n            <\/div>\n          <\/div>\n          <div class=\"grp\">\n            <h4>Event &amp; parallel<\/h4>\n            <div class=\"row\">\n              <span class=\"badge b-emit\">⚡ emits event<\/span>\n              <span class=\"chip\" style=\"color:var(--accent-ink);border-color:var(--accent)\">⇉ parallel collapse<\/span>\n              <span class=\"chip\">▦ shared input<\/span>\n            <\/div>\n          <\/div>\n          <div class=\"grp\">\n            <h4>Quality gate<\/h4>\n            <div class=\"row\">\n              <span class=\"badge b-wired\">✅ auto-gate<\/span>\n              <span class=\"badge b-partial\">◑ auto + exception→human<\/span>\n              <span class=\"badge b-verify\">✋ human-judged<\/span>\n            <\/div>\n          <\/div>\n          <div class=\"grp\">\n            <h4>Skill coverage<\/h4>\n            <div class=\"row\">\n              <span class=\"badge b-wired\">✓ covered<\/span>\n              <span class=\"badge b-partial\">◐ partial<\/span>\n              <span class=\"badge b-absent\">🧩 none<\/span>\n              <span class=\"badge b-doc\">🧩 missing skill<\/span>\n            <\/div>\n          <\/div>\n        <\/div>\n      <\/section>\n\n      <!-- ===== PIPELINE FLOW ===== -->\n      <section class=\"section\" id=\"pipeline\">\n        <div class=\"shead\"><span class=\"num\">01<\/span><h2>End-to-end pipeline · S0 → S7<\/h2><\/div>\n        <p class=\"ssub\">The full delivery path as event-driven stages. Each card shows owner, skill, I/O, gate, tier and handoff format — <b>click to expand<\/b> the SDLC phase, events, schema and failure policy.<\/p>\n        <div class=\"hlbar\">\n          <span class=\"lbl\">▦ Highlight shared input (reuse → parallel-collapse):<\/span>\n          <span id=\"hlchips\"><\/span>\n        <\/div>\n        <div class=\"flow\" id=\"flow\"><\/div>\n      <\/section>\n\n      <!-- ===== STEP SUMMARY ===== -->\n      <section class=\"section\" id=\"summary\">\n        <div class=\"shead\"><span class=\"num\">02<\/span><h2>Step summary · S0 → S7<\/h2><\/div>\n        <p class=\"ssub\">One row per stage: owner, model &amp; tier, gate type, caps / recovery, and wiring status.<\/p>\n        <div class=\"tablewrap scrolly\">\n          <table class=\"dtable\">\n            <thead><tr><th>#<\/th><th>Stage<\/th><th>Owner<\/th><th>Model · Tier<\/th><th>Gate<\/th><th>Caps / recovery<\/th><th>Status<\/th><\/tr><\/thead>\n            <tbody id=\"summaryBody\"><\/tbody>\n          <\/table>\n        <\/div>\n      <\/section>\n\n      <!-- ===== STAGE I/O ===== -->\n      <section class=\"section\" id=\"io\">\n        <div class=\"shead\"><span class=\"num\">03<\/span><h2>Stage I/O · output contract · human review<\/h2><\/div>\n        <p class=\"ssub\">Inputs, outputs, the machine output contract, and whether a human verifies / signs a review document.<\/p>\n        <div class=\"statline\" id=\"iostats\"><\/div>\n        <div class=\"tablewrap scrolly\">\n          <table class=\"dtable\">\n            <thead><tr><th>#<\/th><th>Stage<\/th><th>Input<\/th><th>Output<\/th><th>Output contract<\/th><th>JSON<\/th><th>Verify<\/th><th>Review document<\/th><\/tr><\/thead>\n            <tbody id=\"ioBody\"><\/tbody>\n          <\/table>\n        <\/div>\n      <\/section>\n\n      <!-- ===== STAGE OUTPUTS ===== -->\n      <section class=\"section\" id=\"outputs\">\n        <div class=\"shead\"><span class=\"num\">04<\/span><h2>Stage outputs · machine contract + human-review template<\/h2><\/div>\n        <p class=\"ssub\"><b>Dual output per stage.<\/b> Every stage emits (1) a schema-validated <b>JSON contract → the next node<\/b> (deterministic, replayable — schemas in <code>workflows/schemas/<\/code>) <b>and<\/b> (2) a <b>human-readable review document rendered from a per-stage template<\/b> (<code>integration/templates/<\/code> — archived). Both carry the same <code>audit_id<\/code>: the JSON drives the next node; the templated doc drives human sign-off.<\/p>\n        <div class=\"statline\" id=\"outputstats\"><\/div>\n        <div class=\"tablewrap scrolly\">\n          <table class=\"dtable\">\n            <thead><tr><th>#<\/th><th>Stage<\/th><th>JSON contract → next node<\/th><th>Review document<\/th><th>Template<\/th><th>Format<\/th><\/tr><\/thead>\n            <tbody id=\"outBody\"><\/tbody>\n          <\/table>\n        <\/div>\n        <div class=\"note tight\"><b>Lean decision (Codex GPT-5.5 xHigh brainstorm · Claude final):<\/b> the 3 autonomous stages (S3, S4a, S4b) are <b>JSON-only<\/b> — the readable doc is advisory (template kept), since their evidence surfaces at the adjacent S2 / S4*-review gates. See <code>integration/templates/LEAN_DECISION.md<\/code>.<\/div>\n        <div class=\"diagram\" style=\"margin-top:6px\">\n          <div class=\"stepline\">\n            <div class=\"node orch\">Stage skill<small>emits two artifacts · one <code>audit_id<\/code><\/small><\/div>\n            <span class=\"ar\">⇉<\/span>\n            <div class=\"par\">\n              <div class=\"node\">JSON contract<small>▸ next node · machine handoff · <code>schemas/<\/code><\/small><\/div>\n              <div class=\"node\">Review doc<small>◂ template (<code>templates/<\/code>) ▸ human sign-off<\/small><\/div>\n            <\/div>\n          <\/div>\n          <div class=\"lane why\"><span class=\"tag\">Why<\/span> The JSON is the deterministic, replayable handoff between agent nodes; the templated doc is the human-readable surface a named owner reviews and signs.<\/div>\n        <\/div>\n      <\/section>\n\n      <!-- ===== EVENT BUS ===== -->\n      <section class=\"section\" id=\"bus\">\n        <div class=\"shead\"><span class=\"num\">05<\/span><h2>Event bus · emit → parallel collapse<\/h2><\/div>\n        <p class=\"ssub\">Each stage <b>emits<\/b> a past-tense event carrying its JSON contract; downstream stages <b>subscribe<\/b> and those with no inter-dependency <b>collapse in parallel<\/b>. Partition key = <code>run_id<\/code> (= <code>audit_id<\/code>) → per-run FIFO ordering; at-least-once + idempotent consumer = <b>effectively-once<\/b>; the <b>outbox<\/b> makes \"persist output + emit event\" atomic. Deploy is a <b>saga with a pivot<\/b> — pre-pivot steps compensate via <code>handoff-revoke<\/code>.<\/p>\n        <div class=\"bus\" id=\"busBody\"><\/div>\n      <\/section>\n\n      <!-- ===== INSIDE S4 ===== -->\n      <section class=\"section\" id=\"fanout\">\n        <div class=\"shead\"><span class=\"num\">06<\/span><h2>Inside S4 · orchestrator fan-out &amp; Layer-2 barrier<\/h2><\/div>\n        <p class=\"ssub\">A deterministic orchestrator (code, not an LLM) red-teams the plan, then fans out genuine parallelism across N components. The Layer-2 barrier is the <b>only<\/b> barrier.<\/p>\n        <div class=\"diagram\">\n          <div class=\"stepline\">\n            <div class=\"node orch\">Orchestrator<small>deterministic · code, not LLM · routes by (tag, severity)<\/small><\/div>\n            <span class=\"ar\">→<\/span>\n            <div class=\"node gate\">🔒 Plan-Review<small>red-team before fan-out · <span class=\"cap\">cap 1 → HardFail<\/span><\/small><\/div>\n            <span class=\"ar\">→<\/span>\n            <div class=\"node\">Fan-out × N components<small>genuine parallelism<\/small><\/div>\n          <\/div>\n          <div class=\"lane\">\n            <span class=\"tag\">Per component<\/span>\n            <div class=\"node\">Tech-Designer<\/div><span class=\"ar\">→<\/span>\n            <div class=\"node\">Dev <span class=\"cap\">↔TD cap 2<\/span><\/div><span class=\"ar\">→<\/span>\n            <div class=\"par\">\n              <div class=\"node\">QA-L1<small>conformance<\/small><\/div>\n              <div class=\"node\">Reviewer-L1<small>quality + security · <span class=\"cap\">↔Dev cap 2<\/span><\/small><\/div>\n            <\/div>\n          <\/div>\n          <div class=\"stepline\">\n            <div class=\"node barrier\">Layer-2 barrier<small>the ONLY barrier<\/small><\/div>\n            <span class=\"ar\">→<\/span>\n            <div class=\"par\">\n              <div class=\"node\">QA-L2<small>system acceptance · <span class=\"cap\">→TL/BA cap 1<\/span><\/small><\/div>\n              <div class=\"node\">Reviewer-L2<small>cross-component · <span class=\"cap\">→TL cap 1<\/span><\/small><\/div>\n            <\/div>\n            <span class=\"ar\">→<\/span>\n            <div class=\"node\">Terminal state<\/div>\n          <\/div>\n        <\/div>\n      <\/section>\n\n      <!-- ===== SDLC MAPPING ===== -->\n      <section class=\"section\" id=\"sdlc\">\n        <div class=\"shead\"><span class=\"num\">07<\/span><h2>Real-world SDLC mapping<\/h2><\/div>\n        <p class=\"ssub\">Grounded in ResearchVault — how the squad stages map to conventional SDLC phases, environments and governance.<\/p>\n        <details class=\"acc\" open=\"\">\n          <summary>Squad stages → SDLC phase → environment → governance <span class=\"scount\">6 rows<\/span><span class=\"chev\">▸<\/span><\/summary>\n          <div class=\"accbody flush\">\n            <div class=\"tablewrap\">\n              <table class=\"dtable\">\n                <thead><tr><th>Squad stages<\/th><th>SDLC phase<\/th><th>Environment / mechanism<\/th><th>Gate / governance<\/th><\/tr><\/thead>\n                <tbody>\n                  <tr><td><span class=\"stagename\">S0–S3 · Intake→Contracts<\/span><\/td><td>Requirements &amp; Design<\/td><td class=\"t-muted\">pre-code · DDD command vs event, bounded contexts<\/td><td class=\"t-muted\">async peer + TL sync ★<\/td><\/tr>\n                  <tr><td><span class=\"stagename\">S4a / S4b · Impl<\/span><\/td><td>Development<\/td><td class=\"t-muted\">immutable artifact + unit tests, sandboxed<\/td><td><span class=\"badge b-auto\">AUTO<\/span><\/td><\/tr>\n                  <tr><td><span class=\"stagename\">S4a-r / S4b-r · Review<\/span><\/td><td>Pre-merge CI<\/td><td class=\"t-muted\">unit/integration/<b>contract (Pact)<\/b> + schema-registry FULL<\/td><td class=\"t-muted\">async peer (maker ≠ checker)<\/td><\/tr>\n                  <tr><td><span class=\"stagename\">S4c / S5 · QA<\/span><\/td><td><b>SIT → UAT<\/b> <span class=\"t-muted\">(automated audit-evidence tiers, not human queues)<\/span><\/td><td class=\"t-muted\">contract tests · feature-flag pilot<\/td><td class=\"t-muted\">sync ★ on conditional-go<\/td><\/tr>\n                  <tr><td><span class=\"stagename\">S6 · Deploy<\/span><\/td><td>Release<\/td><td class=\"t-muted\"><b>canary / blue-green + AnalysisTemplate<\/b> · OpenFeature kill-switch<\/td><td><span class=\"badge b-sync\">sync named ★★ — four-eyes<\/span><\/td><\/tr>\n                  <tr><td><span class=\"stagename\">S7 · Prod Validation<\/span><\/td><td>Operate<\/td><td class=\"t-muted\"><b>SLO multi-window burn-rate<\/b> (14.4×/1h · 6×/6h · 3×/24h) · DORA · rollback<\/td><td class=\"t-muted\">sync ★ rollback decision<\/td><\/tr>\n                <\/tbody>\n              <\/table>\n            <\/div>\n          <\/div>\n        <\/details>\n        <div class=\"note\"><b>Banking governance overlay:<\/b> human-verify gates implement <b>maker-checker / four-eyes / segregation-of-duties<\/b>; the event log is an immutable, append-only, signable <b>audit trail<\/b> — a legally-defensible record of who approved what, when.<\/div>\n      <\/section>\n\n      <!-- ===== HUMAN APPROVAL GATES ===== -->\n      <section class=\"section\" id=\"gates\">\n        <div class=\"shead\"><span class=\"num\">08<\/span><h2>Human approval gates · HITL roster<\/h2><\/div>\n        <p class=\"ssub\">A named human verifies at every design / review / QA / deploy boundary — <b>11 of 14 stages<\/b>, each with a concrete review document. Fully autonomous (no human review): <b>S3a/3b Contracts · S4a Backend Impl · S4b Frontend Impl<\/b> — reversible, schema-validated, sandboxed. Review levels: <b>L0<\/b> schema/idempotency (auto) · <b>L1<\/b> skill-execution verify · <b>L2<\/b> peer/cross-squad (async) · <b>L3<\/b> executive/governance (sync named); depth scales by tier.<\/p>\n        <div class=\"tablewrap scrolly\">\n          <table class=\"dtable\">\n            <thead><tr><th>Stage<\/th><th>Human owner of record<\/th><th>Gate type<\/th><th>Review document signed<\/th><\/tr><\/thead>\n            <tbody>\n              <tr><td><span class=\"sid\">S0<\/span> Intake<\/td><td>Delivery Ops<\/td><td class=\"t-muted\">light (plan sign-off)<\/td><td>Run plan<\/td><\/tr>\n              <tr><td><span class=\"sid\">S1<\/span> BA Research<\/td><td>BA lead<\/td><td><span class=\"badge b-async\">⏸ async peer (L2)<\/span><\/td><td>Epic &amp; Stories brief<\/td><\/tr>\n              <tr><td><span class=\"sid\">S1.5<\/span> UX Intake<\/td><td>Tech Lead<\/td><td><span class=\"badge b-async\">⏸ async peer (L2)<\/span><\/td><td>UX pack maturity report<\/td><\/tr>\n              <tr><td><span class=\"sid\">S2<\/span> TL Design<\/td><td>Tech Lead + governance<\/td><td><span class=\"badge b-sync\">🔒 sync named (L3)<\/span><\/td><td>TL Design doc + ADRs<\/td><\/tr>\n              <tr><td><span class=\"sid\">S2.5<\/span> Plan-Review<\/td><td>Tech Lead<\/td><td><span class=\"badge b-gate\">◆ HITL on HardFail<\/span><\/td><td>Plan-review findings<\/td><\/tr>\n              <tr><td><span class=\"sid\">S4a-r<\/span> Backend Review<\/td><td>dev-squad<\/td><td><span class=\"badge b-async\">⏸ async peer (L2)<\/span><\/td><td>Backend review report<\/td><\/tr>\n              <tr><td><span class=\"sid\">S4b-r<\/span> Frontend Review<\/td><td>dev-squad<\/td><td><span class=\"badge b-async\">⏸ async peer (L2)<\/span><\/td><td>Frontend review report<\/td><\/tr>\n              <tr><td><span class=\"sid\">S4c<\/span> QA Test Design<\/td><td>qa-squad lead<\/td><td><span class=\"badge b-sync\">🔒 sync conditional-go (L3)<\/span><\/td><td>Test plan &amp; sign-off criteria<\/td><\/tr>\n              <tr><td><span class=\"sid\">S5<\/span> QA Validation<\/td><td>qa-squad lead<\/td><td><span class=\"badge b-sync\">🔒 sync (L3)<\/span><\/td><td>QA evidence report<\/td><\/tr>\n              <tr><td><span class=\"sid\">S6<\/span> Deploy<\/td><td>Release Manager<\/td><td><span class=\"badge b-sync\">🔒 sync named (L3) — mandatory<\/span><\/td><td>Release runbook + KNOWN_ISSUES + sign-off packet<\/td><\/tr>\n              <tr><td><span class=\"sid\">S7<\/span> Prod Validation<\/td><td>On-call / Release Mgr<\/td><td><span class=\"badge b-sync\">🔒 sync (L3)<\/span><\/td><td>Smoke/SLO report + rollback decision record<\/td><\/tr>\n            <\/tbody>\n          <\/table>\n        <\/div>\n      <\/section>\n\n      <!-- ===== COMMAND-SAFETY ===== -->\n      <section class=\"section\" id=\"safety\">\n        <div class=\"shead\"><span class=\"num\">09<\/span><h2>Command-safety policy · allow / confirm / deny<\/h2><\/div>\n        <p class=\"ssub\">Enforced <b>outside the model<\/b>, at the tool-calling layer. <b>Current state (honest):<\/b> the archived pipeline's <code>.claude/settings.json<\/code> allowlisted only <code>Bash(squad-engine run:*)<\/code> — there is <b>no external policy engine<\/b> enforcing the CONFIRM / DENY tiers yet (Verdict #3).<\/p>\n        <div class=\"tablewrap\">\n          <table class=\"dtable\">\n            <thead><tr><th>Tier<\/th><th>Scope<\/th><\/tr><\/thead>\n            <tbody>\n              <tr><td><span class=\"badge b-wired\">⚙ ALLOW<\/span><\/td><td>Reversible &amp; sandboxed: <code>Bash(squad-engine run:*)<\/code>, run tests in sandbox, read-only repo access, schema validation.<\/td><\/tr>\n              <tr><td><span class=\"badge b-partial\">⏸ CONFIRM<\/span><\/td><td>Irreversible / control-plane: push to main · <b>deploy<\/b> · DB / schema migration · enabling a live external dependency · frontend publish.<\/td><\/tr>\n              <tr><td><span class=\"badge b-absent\">🔒 DENY<\/span><\/td><td>Outside the allowlist: non-allowlisted MCP / tool · network egress outside the sandbox allowlist · long-lived secrets · writing to prod directly · an <b>agent editing its own AGENTS.md / profile / permission config<\/b>.<\/td><\/tr>\n            <\/tbody>\n          <\/table>\n        <\/div>\n      <\/section>\n\n      <!-- ===== MODEL SELECTION ===== -->\n      <section class=\"section\" id=\"models\">\n        <div class=\"shead\"><span class=\"num\">10<\/span><h2>Model selection · suite method <span style=\"font-weight:500;color:var(--faint);font-size:14px\">— roster as of 2026-05-31<\/span><\/h2><\/div>\n        <p class=\"ssub\">Models are assigned by the <code>model-selection<\/code> skill's <b>suite method<\/b>, not a single \"best model\". <b>Gate on data class first, capability last:<\/b> the <b>T1 / T2 / T3<\/b> tiers are the privacy / risk gate (banking-regulated → production → research); within each, a role is matched to a capability tier. Reasoning effort is set <b>per task by difficulty<\/b>. Models are <b>dated examples behind a vendor-neutral abstraction<\/b> — <b>re-evaluate quarterly<\/b> (next ~2026-08-31).<\/p>\n        <details class=\"acc\" open=\"\">\n          <summary>Capability tiers · dated example models · routing <span class=\"scount\">3 tiers<\/span><span class=\"chev\">▸<\/span><\/summary>\n          <div class=\"accbody flush\">\n            <div class=\"tablewrap\">\n              <table class=\"dtable\">\n                <thead><tr><th>Capability tier<\/th><th>Dated example models (2026-05-31)<\/th><th>Used by (roles / stages)<\/th><th>Reasoning<\/th><th>Routing · fallback<\/th><\/tr><\/thead>\n                <tbody>\n                  <tr>\n                    <td><b>Frontier-reasoning<\/b><br><span class=\"t-muted\">planning · judgment · review · high-stakes<\/span><\/td>\n                    <td><code>Claude Opus 4.8<\/code> · <code>GPT-5.5<\/code> · <code>Gemini 3.1 Pro<\/code> (Deep Think)<\/td>\n                    <td class=\"t-muted\">Orchestrator · TL Design (S2) · Plan-Review (S2.5) · code reviews (S4a-r / S4b-r) · QA Validation (S5) · Deploy / Prod (S6 / S7)<\/td>\n                    <td><span class=\"badge b-sync\">High<\/span><\/td>\n                    <td class=\"t-muted\">static per-role · same-provider / cross-region fallback · log the served model<\/td>\n                  <\/tr>\n                  <tr>\n                    <td><b>Mid-tier<\/b><br><span class=\"t-muted\">high-volume impl · structured design<\/span><\/td>\n                    <td><code>Claude Sonnet 4.6<\/code> · <code>GPT-5.5 Instant<\/code><\/td>\n                    <td class=\"t-muted\">Backend / Frontend Impl (S4a / S4b) · Contracts (S3) · QA Test Design (S4c)<\/td>\n                    <td><span class=\"badge b-partial\">Medium<\/span><\/td>\n                    <td class=\"t-muted\">cascade — escalate to frontier on low confidence<\/td>\n                  <\/tr>\n                  <tr>\n                    <td><b>Cheap-fast<\/b><br><span class=\"t-muted\">bulk extraction · summarization · bounded schema calls<\/span><\/td>\n                    <td><code>Claude Haiku 4.5<\/code> · Flash-class<\/td>\n                    <td class=\"t-muted\">intake normalization · story / field extraction sub-steps<\/td>\n                    <td><span class=\"badge b-wired\">Low<\/span><\/td>\n                    <td class=\"t-muted\">cascade cheap-first · strict-schema decoding required<\/td>\n                  <\/tr>\n                <\/tbody>\n              <\/table>\n            <\/div>\n          <\/div>\n        <\/details>\n        <p class=\"srcbar\"><b>Roster grounded in<\/b> — WebSearch: <code>anthropic.com<\/code> (Claude Opus 4.8, 2026-05-28) · <code>openai.com<\/code> (GPT-5.5) · <code>ai.google.dev<\/code> (Gemini 3.1 Pro) — cross-checked against the ResearchVault. Change since last roster: <b>Claude Opus 4.7 → 4.8<\/b>; GPT-5.5 and Gemini 3.1 Pro unchanged.<\/p>\n      <\/section>\n\n      <!-- ===== QUALITY GATES ===== -->\n      <section class=\"section\" id=\"quality\">\n        <div class=\"shead\"><span class=\"num\">11<\/span><h2>Quality gates · test matrix<\/h2><\/div>\n        <p class=\"ssub\">unit → integration → contract → E2E → security → performance → a11y. Each test type is <b>measured by a runner skill<\/b> — a metric vs an explicit <b>pass threshold<\/b> → a machine verdict + JSON evidence (<code>audit_id<\/code>). <b>Auto-gate, exception-only:<\/b> auto-passes on green and escalates <b>only exceptions<\/b> to a human, collapsing review to a single aggregate sign-off at S5 / S4c.<\/p>\n        <div class=\"statline\" id=\"teststats\"><\/div>\n        <div class=\"tablewrap scrolly\">\n          <table class=\"dtable\">\n            <thead><tr><th>Test type<\/th><th>Level<\/th><th>Runner skill<\/th><th>Metric · pass-threshold<\/th><th>Gate<\/th><th>Status<\/th><\/tr><\/thead>\n            <tbody id=\"testBody\"><\/tbody>\n          <\/table>\n        <\/div>\n      <\/section>\n\n      <!-- ===== SKILL COVERAGE ===== -->\n      <section class=\"section\" id=\"skills\">\n        <div class=\"shead\"><span class=\"num\">12<\/span><h2>Skill coverage · missing skill per step<\/h2><\/div>\n        <p class=\"ssub\">From the <b>squad-skill-gap workflow<\/b> (53 agents): each step was mapped to the skill catalog, then confirmed against the ResearchVault. <b>Update 2026-06-02 (consolidation):<\/b> the catalog was reduced to actual use — the <b>14 skills the pipeline references<\/b> now live in <code>workflows/skills/<\/code> (each resolves from its <code>skill_ref<\/code>), and the ~100 unused skills plus the old <code>manifest.json<\/code> were deleted. <b>14 of 16<\/b> stage refs resolve; the 2 still unbuilt are <code>handoff-to-deploy<\/code> and <code>handoff-revoke<\/code> (S6, OI-002). Rows marked removed below were draft skills deleted as unused by the pipeline.<\/p>\n        <div class=\"statline\" id=\"skillstats\"><\/div>\n        <details class=\"acc\">\n          <summary>Full coverage table — step · skill · coverage · fix · missing · source <span class=\"scount\">26 rows<\/span><span class=\"chev\">▸<\/span><\/summary>\n          <div class=\"accbody flush\">\n            <div class=\"tablewrap scrolly\">\n              <table class=\"dtable\">\n                <thead><tr><th>Step<\/th><th>Existing skill<\/th><th>Coverage<\/th><th>Fix<\/th><th>Missing skill (proposed)<\/th><th>Source (vault / web)<\/th><\/tr><\/thead>\n                <tbody id=\"skillBody\"><\/tbody>\n              <\/table>\n            <\/div>\n          <\/div>\n        <\/details>\n      <\/section>\n\n      <!-- ===== TERMINAL STATES ===== -->\n      <section class=\"section\" id=\"terminal\">\n        <div class=\"shead\"><span class=\"num\">13<\/span><h2>Terminal states<\/h2><\/div>\n        <p class=\"ssub\">Where a run can come to rest. The ShopPilot dry-run ended on <b>ShipWithCaveats<\/b>.<\/p>\n        <div class=\"terms\">\n          <div class=\"term done\"><div class=\"t\"><span class=\"dot\" style=\"background:var(--done)\"><\/span>Done<\/div><p>All clean. Proceeds toward Deploy gate.<\/p><\/div>\n          <div class=\"term ship\"><div class=\"t\"><span class=\"dot\" style=\"background:var(--ship)\"><\/span>ShipWithCaveats<\/div><p>Per-edge cap hit, <b>no<\/b> <i>required<\/i> component with an unresolved <b>high<\/b>. Caveats documented (<code>KNOWN_ISSUES.md<\/code>). <b>Actual outcome of the ShopPilot dry-run.<\/b><\/p><\/div>\n          <div class=\"term fail\"><div class=\"t\"><span class=\"dot\" style=\"background:var(--fail)\"><\/span>Failed<\/div><p>Per-edge cap hit <b>and<\/b> a <i>required<\/i> component has an unresolved <b>high<\/b>.<\/p><\/div>\n          <div class=\"term hard\"><div class=\"t\"><span class=\"dot\" style=\"background:var(--fail)\"><\/span>HardFail<\/div><p>Plan-Reviewer cap exceeded — do <b>not<\/b> fan out on a bad plan.<\/p><\/div>\n        <\/div>\n      <\/section>\n\n      <!-- ===== RUNTIME ===== -->\n      <section class=\"section\" id=\"runtime\">\n        <div class=\"shead\"><span class=\"num\">14<\/span><h2>Runtime · validation<\/h2><\/div>\n        <p class=\"ssub\">How this design actually executes. This overview <b>records and recommends<\/b> — it never runs or operates the pipeline.<\/p>\n        <div class=\"cmdcard\"><b>As of 2026-06-01 the Rust <code>squad-engine<\/code> runtime and <code>workflow-v1.schema.json<\/code> are archived<\/b> — there is no live engine to run the pipeline. The historical engine (<code>reference/engine/<\/code>, archived) was an event-driven concurrent scheduler (backend ∥ frontend legs in parallel) with per-stage JSON-Schema contract validation, a content-addressed cache keyed on <code>sha256(skill_ref, version, prompt_version, input_hash)<\/code>, resumable <code>state.json<\/code>, and a tamper-evident audit trail (<code>run-log.md<\/code> + <code>audit-trace.jsonl<\/code>); terminal states <b>Done · WaitingHuman · Failed · HardFail · ShipWithCaveats<\/b>.<\/div>\n        <div class=\"cmdcard\"><b>Validation is now static<\/b> (no live engine): YAML well-formedness + <code>ajv<\/code> / <code>jsonschema<\/code> (draft-07) on the <code>workflows/schemas/<\/code> boundary schemas against demo artifacts (<code>tmp/runs/shoppilot/S1-ba-research/{discovery.json, INDEX.json}<\/code>) + a <code>depends_on<\/code> graph check on <code>workflows/delivery-pipeline.yaml<\/code> (the single canonical file). Banking-grade human gates remain the default; deploy-class actions require synchronous named-human approval.<\/div>\n      <\/section>\n\n      <!-- ===== VERDICT ===== -->\n      <section class=\"section\" id=\"verdict\">\n        <div class=\"shead\"><span class=\"num\">15<\/span><h2>Verdict<\/h2><\/div>\n        <div class=\"verdict\">\n          <h3>⚠ CONDITIONAL — design ready for human sign-off once these gaps close<\/h3>\n          <ol>\n            <li><b>Deploy (S6) &amp; Prod-Validation (S7)<\/b> get a <b>named approver<\/b> + the missing <code>handoff-to-deploy<\/code> / <code>handoff-revoke<\/code> skills (OI-002) and stage owners (OI-003). The raw-requirement→production path is not complete in execution until these are wired.<\/li>\n            <li><b>Deploy credentials → short-lived OIDC tokens<\/b> (no long-lived secrets) before the deploy gate is enabled.<\/li>\n            <li><b>External allow / confirm / deny policy engine<\/b> stood up — today only a minimal <code>squad-engine run:*<\/code> allowlist exists.<\/li>\n            <li><b><code>agent.trace.v1<\/code><\/b> tamper-evident, both-halves audit (GAP-14) + <b>typed HITL approval records<\/b> (GAP-13).<\/li>\n            <li><b>Test-execution layer (0/12 execute today):<\/b> wire <b>S5 QA-execution (GAP-05)<\/b> to actually run unit / integration / contract; add <b>E2E<\/b> (Playwright), <b>security DAST/SCA<\/b> (Semgrep / Trivy / Trufflehog), <b>performance/load<\/b> (k6), <b>a11y<\/b> (axe — closes OI-004), and <b>canary analysis<\/b> (Argo AnalysisTemplate).<\/li>\n          <\/ol>\n        <\/div>\n        <div class=\"foot\">\n          <b>Boundary.<\/b> This is a supervision-design artifact — it records and recommends; it never runs, deploys, or operates the pipeline, and never relaxes a gate. Companion: <b>README.md<\/b> (consolidated design reference). Generated 2026-05-31 · updated 2026-06-01.\n          <div class=\"srcbar\" style=\"margin-top:12px\">\n            <b>Grounded in ResearchVault<\/b> (Obsidian) — <code>[[event-messaging/workflow-orchestration-vs-choreography]]<\/code> · <code>[[event-messaging/outbox-pattern]]<\/code> · <code>[[event-messaging/saga-pattern-in-financial-systems]]<\/code> · <code>[[agent-orchestration/agentic-software-delivery-lifecycle]]<\/code> · <code>[[platform-devops/environment-strategy-sit-uat-prd]]<\/code> · <code>[[deployment-delivery/progressive-delivery]]<\/code> · <code>[[observability-reliability/slo-sli-design]]<\/code> · <code>[[ddd-architecture/sync-command-async-event-hybrid]]<\/code> · <code>[[fintech-architecture/event-driven-banking-systems]]<\/code>.\n            <br><b>Honest gap:<\/b> the vault has <b>no dedicated E2E, performance/load, or accessibility report<\/b> — those rows rest on the squad skills + the OI-004 WCAG finding.\n          <\/div>\n        <\/div>\n      <\/section>\n\n    <\/main>\n  <\/div>\n<\/div>\n\n<div id=\"tip\"><\/div>\n\n\n\n<script src=\"c7f43bda-1a41-4a72-a2aa-5fac3269ac6d\"><\/script>\n<script src=\"c022aabb-11d4-4f03-81ec-4bab63460cb0\"><\/script>\n\n\n<\/body><\/html>"
